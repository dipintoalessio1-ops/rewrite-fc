<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101722"><title>REWRITE FC · Vita Presidenziale</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f2f5fa;background:#101722;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:650px;margin:auto;padding:18px 15px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin:3px 0 24px}.brand{font-size:12px;font-weight:800;letter-spacing:.14em;color:#f0807d}.muted{color:#a5b0be}.small{font-size:12px}.tiny{font-size:11px}.title{font-size:27px;letter-spacing:-.035em;margin:5px 0 8px}.subtitle{font-size:14px;color:#a5b0be;margin:0 0 20px}.card{background:#202c3b;border:1px solid #293849;border-radius:16px;padding:17px;margin:11px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:11px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{text-align:center;background:#202c3b;border-radius:12px;padding:13px 5px}.stat b{font-size:19px;display:block}.stat span{font-size:11px;color:#a5b0be}.btn{border:0;border-radius:11px;background:#f0807d;color:#1d1e25;padding:13px 14px;font-weight:750;width:100%;min-height:44px}.btn.alt{background:#334255;color:#f2f5fa}.btn.ghost{background:transparent;border:1px solid #405064;color:#dce4ee}.btn.sm{width:auto;padding:8px 12px;min-height:35px;font-size:12px}.field{display:grid;gap:6px;font-size:12px;color:#b9c5d2}.field input,.field select,.field textarea{width:100%;background:#101a27;color:#f4f6f9;border:1px solid #435165;border-radius:10px;padding:12px;min-height:43px}.field textarea{min-height:100px;resize:vertical}.field option{background:#101a27}.nav{position:fixed;bottom:0;left:0;right:0;background:#141e2bdc;backdrop-filter:blur(20px);border-top:1px solid #354354;padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}.nav-inner{display:flex;width:100%;max-width:650px;justify-content:space-between}.nav button{border:0;background:none;color:#a5b0be;font-size:10px;min-width:57px;padding:6px 0}.nav button.active{color:#f0807d}.nav .ico{display:block;font-size:20px;margin-bottom:4px}.linkrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 2px;border-bottom:1px solid #39495a;cursor:pointer}.linkrow:last-child{border:0}.tag{display:inline-block;border-radius:20px;background:#344255;color:#d8e1ec;padding:5px 9px;font-size:11px}.tag.red{background:#51353e;color:#ffb5af}.separator{border:0;border-top:1px solid #39495a;margin:14px 0}.note{font-size:12px;color:#b3c0cf;line-height:1.55}.pill{display:inline-flex;gap:6px;align-items:center}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.tabs button{white-space:nowrap;border:1px solid #3a495b;border-radius:20px;background:transparent;color:#c2ccda;padding:9px 13px}.tabs button.active{background:#f0807d;color:#1b2028;border-color:#f0807d}.event{border-left:2px solid #f0807d;padding:3px 0 3px 13px;margin:13px 0}.hide{display:none!important}.center{text-align:center}.spacer{height:8px}h3{font-size:16px;margin:20px 0 10px}p{line-height:1.55}input[type=checkbox]{width:auto}.score{font-size:52px;font-weight:800;text-align:center;letter-spacing:-.04em}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);max-width:90%;background:#e3f0e9;color:#182e25;border-radius:12px;padding:12px 16px;z-index:20;font-size:13px;box-shadow:0 6px 30px #0005}.line{line-height:1.5}@media(min-width:650px){.app{padding-top:26px}}
.roster-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.roster-table{border-collapse:collapse;width:100%;min-width:540px;font-size:12px}.roster-table th,.roster-table td{padding:12px 8px;border-bottom:1px solid #39495a;text-align:center;white-space:nowrap}.roster-table th:first-child,.roster-table td:first-child{text-align:left;min-width:145px}.roster-table tr[data-action]{cursor:pointer}.roster-table tr[data-action]:active{background:#334255}</style></head><body><main id="app" class="app"></main><nav id="nav" class="nav hide"><div class="nav-inner" id="navinner"></div></nav><div id="toast" class="toast hide"></div><script>
'use strict';
const KEY='rewrite_fc_v3_foundation_v1';const CLUBS=[['Inter','Serie A','Lombardia',78],['Milan','Serie A','Lombardia',77],['Juventus','Serie A','Piemonte',78],['Napoli','Serie A','Campania',77],['Roma','Serie A','Lazio',75],['Atalanta','Serie A','Lombardia',75],['Bari','Serie B','Puglia',66],['Palermo','Serie B','Sicilia',67],['Sampdoria','Serie B','Liguria',65],['Bologna','Serie A','Emilia-Romagna',73],['Fiorentina','Serie A','Toscana',73],['Lazio','Serie A','Lazio',74],['Torino','Serie A','Piemonte',71],['Genoa','Serie A','Liguria',70],['Lecce','Serie A','Puglia',67],['Udinese','Serie A','Friuli-Venezia Giulia',70],['Cagliari','Serie A','Sardegna',67],['Sassuolo','Serie A','Emilia-Romagna',68],['Parma','Serie A','Emilia-Romagna',68],['Pisa','Serie B','Toscana',65],['Venezia','Serie B','Veneto',66],['Empoli','Serie B','Toscana',65],['Frosinone','Serie B','Lazio',65],['Monza','Serie B','Lombardia',67],['Cesena','Serie B','Emilia-Romagna',64],['Modena','Serie B','Emilia-Romagna',64],['Reggiana','Serie B','Emilia-Romagna',63],['Catanzaro','Serie B','Calabria',65],['Avellino','Serie B','Campania',62],['Padova','Serie B','Veneto',62],['Pescara','Serie B','Abruzzo',62],['Mantova','Serie B','Lombardia',62],['Spezia','Serie B','Liguria',63],['Carrarese','Serie B','Toscana',62],['Sudtirol','Serie B','Trentino-Alto Adige',63],['Entella','Serie B','Liguria',62],['Brescia','Serie C','Lombardia',61],['Vicenza','Serie C','Veneto',62],['Catania','Serie C','Sicilia',62],['Salernitana','Serie C','Campania',62],['Altamura','Serie C','Puglia',58],['Benevento','Serie C','Campania',63],['Crotone','Serie C','Calabria',60],['Foggia','Serie C','Puglia',58],['Bisceglie','Serie D','Puglia',51],['Bitonto','Eccellenza','Puglia',45],['Taranto','Eccellenza','Puglia',48],['Toritto','Eccellenza','Puglia',42]];
const NAMES=['Andrea Rinaldi','Luca Moretti','Matteo Ferri','Davide Conti','Alessandro Ricci','Marco Gallo','Simone Esposito','Francesco Greco','Nicola Romano','Federico Costa','Gabriele De Luca','Pietro Marino','Antonio Caruso','Stefano Lombardi','Giorgio Vitale','Emanuele Serra','Roberto Messina','Filippo Fontana','Daniele Rizzo','Giuseppe Longo','Tommaso Sala','Cristian Barbieri','Michele Pellegrini','Edoardo Fabbri','Leonardo Parisi','Samuele Orlando','Vincenzo Grassi','Riccardo Amato'];
const REGIONS=['Lombardia','Piemonte','Veneto','Liguria','Emilia-Romagna','Toscana','Lazio','Campania','Puglia','Sicilia','Sardegna','Calabria','Abruzzo','Marche','Umbria','Molise','Basilicata','Friuli-Venezia Giulia','Trentino-Alto Adige','Valle d’Aosta'];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('it-IT');const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[rand(0,a.length-1)];const date=s=>new Date(s+'T12:00:00');const iso=d=>d.toISOString().slice(0,10);const plus=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return iso(d)};const labelDate=s=>date(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const clubMeta=name=>CLUBS.find(x=>x[0]===name)||[name,'Serie D','Puglia',52];
let state=null,screen='home',marketTab='search',officeTab='staff',playerId=null,search={name:'',role:'',club:''},game=null,tutorialStep=0;
function persist(){if(state)localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hide');setTimeout(()=>el.classList.add('hide'),2400)}
function btn(t,fn,alt=false){return `<button class="btn ${alt?'alt':''}" data-action="${fn}">${escapeHTML(t)}</button>`}function card(s){return `<div class="card">${s}</div>`}function row(title,sub,action,right='›'){return `<div class="linkrow" data-action="${action}"><div><b>${escapeHTML(title)}</b><div class="muted small" style="margin-top:4px">${escapeHTML(sub)}</div></div><span class="muted">${right}</span></div>`}function head(t,sub=''){return `<h1 class="title">${escapeHTML(t)}</h1>${sub?`<p class="subtitle">${escapeHTML(sub)}</p>`:''}`}
function render(){let app=document.getElementById('app'),nav=document.getElementById('nav');if(!state){nav.classList.add('hide');app.innerHTML=landing();return}nav.classList.remove('hide');let pages={home:home,agenda:agenda,rosa:rosa,market:market,player:player,office:office,sport:sport,match:match,conversation:conversationView,staff:staff,archive:archive,finance:finance,sponsor:sponsor,settings:settings,tutorial:tutorial};let main=(pages[screen]||home)();app.innerHTML=`<header class="top"><div><div class="brand">REWRITE FC <span class="muted">· ALPHA 3.4</span></div><div class="muted tiny" style="margin-top:5px">${escapeHTML(state.club)} · ${escapeHTML(state.league)} · ${state.season}/${String(state.season+1).slice(-2)}</div></div><button class="btn sm alt" data-action="settings">⚙</button></header>${main}`;document.getElementById('navinner').innerHTML=[['home','⌂','Home'],['agenda','▦','Agenda'],['rosa','♙','Rosa'],['market','⌕','Mercato'],['sport','♜','Sport'],['office','▣','Ufficio']].map(([id,ic,t])=>`<button data-action="nav:${id}" class="${screen===id?'active':''}"><span class="ico">${ic}</span>${t}</button>`).join('')}
function landing(){return `<div class="top"><div class="brand">REWRITE FC · VITA PRESIDENZIALE</div><span class="tag">Alpha 3.6</span></div>${head('Riscrivi la storia del calcio.','Acquisisci una società reale. Costruisci il tuo futuro da presidente.')} ${card(`<h3>Nuova carriera</h3><div class="stack"><label class="field">Società da acquisire<select id="newclub">${CLUBS.map(c=>`<option>${escapeHTML(c[0])}</option>`).join('')}</select></label><label class="field">Campionato di partenza<select id="newleague"><option>Serie A</option><option>Serie B</option><option>Serie C</option><option>Serie D</option><option>Eccellenza</option></select></label><label class="field">Scenario<select id="newscenario"><option value="standard">Acquisizione ordinaria</option><option value="crisis">Società in crisi</option><option value="failure">Rifondazione dopo fallimento (€ 1, senza trattative)</option><option value="ambition">Nuova proprietà ambiziosa</option></select></label><label class="field">Regione (per Eccellenza)<select id="newregion">${REGIONS.map(x=>`<option>${escapeHTML(x)}</option>`).join('')}</select></label><label class="field">Nome del presidente<input id="newpresident" placeholder="Il tuo nome" maxlength="50"></label><button class="btn" data-action="new">Crea carriera</button></div>`)}<p class="note">Questa build contiene un database dimostrativo, non le rose reali complete 2026/27. Il salvataggio avviene localmente su questo dispositivo.</p>`}
function buildPlayers(team,level,count=21){return Array.from({length:count},(_,i)=>{let role=i<2?'POR':i<9?'DIF':i<16?'CEN':'ATT';let id=team.replace(/\W/g,'')+'_'+i;return {id,name:NAMES[(i+CLUBS.findIndex(x=>x[0]===team)*3+NAMES.length*10)%NAMES.length],team,owner:team,loan:null,role,age:rand(19,34),value:Math.round((level-30)**2*(role==='ATT'?1.4:1)*rand(2,12)*1000),contract:2028+rand(0,3),salary:rand(15,110)*1000,apps:0,goals:0,assists:0,minutes:0,rating:0,watched:false,form:rand(55,85)}})}
function newCareer(){let club=document.getElementById('newclub').value,league=document.getElementById('newleague').value,scenario=document.getElementById('newscenario').value,region=document.getElementById('newregion').value,president=document.getElementById('newpresident').value.trim()||'Presidente',base=clubMeta(club),failure=scenario==='failure';let roster=buildPlayers(club,base[3],failure?13:21);if(failure){roster.forEach(p=>{p.value=Math.round(p.value*.13);p.salary=Math.round(p.salary*.2);p.contract=2027})}let rivals=CLUBS.filter(x=>x[0]!==club&&x[1]===league).slice(0,7).map(x=>x[0]);while(rivals.length<7)rivals.push('Società '+(rivals.length+1));let teams=[club,...rivals];let fixtures=[];for(let round=0;round<14;round++){let rot=teams.slice();for(let r=0;r<round%7;r++)rot=[rot[0],rot[7],...rot.slice(1,7)];for(let j=0;j<4;j++){let a=rot[j],b=rot[7-j];if(round>=7)[a,b]=[b,a];fixtures.push({round:round+1,home:a,away:b,played:false,score:null,date:plus('2026-08-22',round*7)})}}let cash=failure?180000:scenario==='crisis'?1000000:scenario==='ambition'?65000000:9000000;state={version:3,club,league,region,scenario,president,season:2026,day:'2026-08-20',cash,acquisitionCost:failure?1:0,players:roster,others:CLUBS.filter(x=>x[0]!==club).flatMap(x=>buildPlayers(x[0],x[3],9)),teams,fixtures,history:[],news:[],relations:{ds:60,coach:60,press:50,fans:60},staff:[{id:'ds',name:'Marco Bellini',role:'Direttore sportivo',mood:65},{id:'coach',name:'Lorenzo Ferretti',role:'Allenatore',mood:60},{id:'scout',name:'Davide Serra',role:'Responsabile scouting',mood:60}],tasks:[],offers:[],talks:[],watched:[],round:0,tutorialDone:false,scoutReports:[],sponsors:[{name:'Partner locale',annual:failure?30000:300000,until:2027}],logs:[],champions:[],match:null};log(`Acquisizione ${club}: ${failure?'rifondazione diretta a € 1': 'nuova proprietà'}.`);log('Inizio della tua carriera da presidente.');screen='tutorial';tutorialStep=0;persist();render()}
function log(t){state.history.unshift({day:state.day,text:t});state.history=state.history.slice(0,400)}function news(t,who='Società',urgent=false){state.news.unshift({id:'n'+Date.now()+Math.random(),day:state.day,who,text:t,urgent,read:false});state.news=state.news.slice(0,80)}function schedule(type,days,data){state.tasks.push({id:'t'+Math.random(),type,due:plus(state.day,days),data})}function today(){return state.fixtures.find(f=>f.date<=state.day&&!f.played&&(f.home===state.club||f.away===state.club))}function pending(){return state.news.filter(x=>!x.read).length+state.offers.filter(x=>x.status==='open').length}
function home(){let m=today(),next=state.fixtures.find(f=>!f.played&&(f.home===state.club||f.away===state.club));return `${head('Buongiorno, Presidente.',labelDate(state.day))}${card(`<div class="muted tiny">${m?'OGGI · PARTITA':'PROSSIMA PARTITA'} · ${escapeHTML(state.league)}</div><div class="row" style="margin:20px 0"><b>${escapeHTML(next?.home||state.club)}</b><strong>VS</strong><b>${escapeHTML(next?.away||'—')}</b></div><div class="center muted small">${next?labelDate(next.date):'Calendario da aggiornare'}</div>`)}<div class="row"><h3>La tua giornata</h3><span class="muted small">${pending()} da leggere</span></div>${state.news.filter(x=>!x.read).slice(0,2).map(n=>card(`<b>${escapeHTML(n.who)}</b><p class="note">${escapeHTML(n.text)}</p>${btn('Apri comunicazioni','nav:agenda',true)}`)).join('')||card('<span class="muted">Nessuna comunicazione urgente. Puoi prendere l’iniziativa dall’Agenda.</span>')}<div class="grid3"><div class="stat"><b>${euro(state.cash)}</b><span>Disponibilità</span></div><div class="stat"><b>${state.round}/14</b><span>Giornate</span></div><div class="stat"><b>${state.players.length}</b><span>Rosa</span></div></div><div class="spacer"></div>${m?btn('Segui la partita','startmatch'):btn('Avanza di un giorno','advance')}${btn('Apri l’Agenda','nav:agenda',true)}`}
function tutorial(){let steps=[['Benvenuto, Presidente','Non sei l’allenatore. Guidi la società: personale, mercato, bilancio e relazioni.'],['La tua giornata','La Home mostra gli eventi importanti. Nell’Agenda puoi prendere l’iniziativa o rispondere alle comunicazioni.'],['Il mondo reagisce','Direttive e promesse vengono ricordate; lo staff torna da te dopo alcuni giorni con aggiornamenti.'],['Il campo e la storia','L’allenatore gestisce le partite. Tu puoi seguire la cronaca, fare mercato e costruire il club stagione dopo stagione.']];let s=steps[tutorialStep];return `${head('Primi passi',`Tutorial ${tutorialStep+1} di ${steps.length}`)}${card(`<div class="center" style="font-size:38px;padding:22px">${['♜','▦','♧','⚑'][tutorialStep]}</div><h2 class="center">${s[0]}</h2><p class="center muted">${s[1]}</p>`)}<div class="row"><button class="btn alt sm" data-action="skipTutorial">Salta</button><button class="btn sm" data-action="nextTutorial">${tutorialStep===3?'Inizia la carriera':'Continua →'}</button></div>`}
function agenda(){return `${head('Agenda',labelDate(state.day))}${card(`<h3>Prendi l’iniziativa</h3><div class="grid2">${[['Convoca il DS','meet:ds'],['Parla con l’allenatore','meet:coach'],['Richiedi scouting','meet:scout'],['Conferenza stampa','meet:press']].map(([t,a])=>`<button class="btn alt" data-action="${a}">${t}</button>`).join('')}</div>`)}<h3>Comunicazioni</h3>${state.news.length?state.news.slice(0,20).map(n=>card(`<div class="row"><b>${escapeHTML(n.who)}</b><span class="muted tiny">${escapeHTML(n.day)}</span></div><p class="note">${escapeHTML(n.text)}</p>${!n.read?`<button class="btn alt sm" data-action="read:${n.id}">Segna come letta</button>`:''}`)).join(''):card('<span class="muted">Nessuna comunicazione. Il mondo continua anche nei giorni tranquilli.</span>')}<h3>Attività in corso</h3>${state.tasks.length?state.tasks.map(t=>card(`<b>${escapeHTML(t.type)}</b><div class="muted small">Prevista: ${escapeHTML(t.due)}</div>`)).join(''):card('<span class="muted">Nessuna attività programmata.</span>')}`}
function rosa(){return `${head('Rosa',`${state.players.length} calciatori · ${state.club}`)}${card(`<div class="roster-scroll"><table class="roster-table"><thead><tr><th>Giocatore</th><th>PG</th><th>Gol</th><th>Assist</th><th>RI</th><th>Voto medio</th></tr></thead><tbody>${state.players.map(p=>`<tr data-action="player:${p.id}" tabindex="0"><td><b>${escapeHTML(p.name)}</b><div class="muted tiny">${p.role} · ${p.age} anni</div></td><td>${p.apps||0}</td><td>${p.goals||0}</td><td>${p.assists||0}</td><td>${p.role==='POR'?(p.conceded||0):'—'}</td><td>${p.apps?Number(p.rating||0).toFixed(1):'—'}</td></tr>`).join('')}</tbody></table></div><p class="note">PG: partite giocate · RI: reti incassate (portieri). Tocca un calciatore per aprire la scheda.</p>`)}` }
function market(){let all=[...state.players,...state.others];let filtered=all.filter(p=>(search.name||search.role||search.club)&&(!search.name||p.name.toLowerCase().includes(search.name.toLowerCase()))&&(!search.role||p.role===search.role)&&(!search.club||p.team.toLowerCase().includes(search.club.toLowerCase()))).slice(0,35);return `${head('Mercato','Ricerca, osservatori e trattative')}<div class="tabs">${[['search','Ricerca'],['watched','Osservati'],['offers','Offerte'],['deals','Trattative']].map(([id,t])=>`<button class="${marketTab===id?'active':''}" data-action="tab:${id}">${t}</button>`).join('')}</div>${marketTab==='search'?card(`<div class="stack"><label class="field">Nome<input id="filterName" value="${escapeHTML(search.name)}" placeholder="Nome o cognome"></label><label class="field">Ruolo<select id="filterRole"><option value="">Tutti i ruoli</option>${['POR','DIF','CEN','ATT'].map(x=>`<option ${search.role===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Società<input id="filterClub" value="${escapeHTML(search.club)}" placeholder="Nome della squadra"></label><div class="row"><button class="btn alt sm" data-action="clearFilters">Azzera</button><button class="btn sm" data-action="applyFilters">Cerca</button></div></div>`)+(search.name||search.role||search.club?card(filtered.length?filtered.map(p=>row(p.name,`${p.team} · ${p.role} · ${euro(p.value)}`,`player:${p.id}`)).join(''):'<span class="muted">Nessun risultato.</span>'):card('<div class="center muted">Inserisci almeno un filtro per cercare un giocatore.</div>')):marketTab==='watched'?card(state.watched.length?state.watched.map(id=>{let p=all.find(x=>x.id===id);return p?row(p.name,`${p.team} · ${p.role}`,`player:${id}`):''}).join(''):'<span class="muted">Nessun giocatore osservato.</span>'):marketTab==='offers'?card(state.offers.length?state.offers.map(o=>`<div class="event"><b>${escapeHTML(o.from)} → ${escapeHTML(all.find(p=>p.id===o.player)?.name||'Calciatore')}</b><p>${euro(o.amount)} · ${escapeHTML(o.status)}</p>${o.status==='open'?`<div class="grid2"><button class="btn alt" data-action="reject:${o.id}">Rifiuta</button><button class="btn" data-action="accept:${o.id}">Accetta</button></div><button class="btn ghost" style="margin-top:7px" data-action="counter:${o.id}">Controproposta</button>`:''}</div>`).join(''):'<span class="muted">Nessuna offerta ricevuta.</span>'):card(state.talks.length?state.talks.map(t=>`<div class="event"><b>${escapeHTML(t.playerName)}</b><p class="note">${escapeHTML(t.text)} · ${escapeHTML(t.status)}</p></div>`).join(''):'<span class="muted">Nessuna trattativa avviata.</span>')}`}

function standings(){let rows=state.teams.map(t=>({name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));for(let f of state.fixtures.filter(f=>f.played)){let a=rows.find(t=>t.name===f.home),b=rows.find(t=>t.name===f.away);if(!a||!b)continue;a.p++;b.p++;a.gf+=f.score[0];a.ga+=f.score[1];b.gf+=f.score[1];b.ga+=f.score[0];if(f.score[0]>f.score[1]){a.w++;a.pts+=3;b.l++}else if(f.score[0]<f.score[1]){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}}return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}

function simulateScore(a,b){let strength=n=>{let c=clubMeta(n);return c[3]-(state.scenario==='failure'&&n===state.club?22:0)};let delta=(strength(a)-strength(b))/24;let home=Math.max(0,Math.min(5,Math.round(1.3+delta+Math.random()*2-1)));let away=Math.max(0,Math.min(5,Math.round(1.05-delta+Math.random()*2-1)));return [home,away]}
function startMatch(){let f=today();if(!f){toast('Nessuna partita da disputare oggi');return}if(!state.match){let result=simulateScore(f.home,f.away),events=[{min:1,text:'Fischio d’inizio.'}];let goals=[];for(let i=0;i<result[0];i++)goals.push({min:rand(5,89),text:`GOL ${f.home}!`});for(let i=0;i<result[1];i++)goals.push({min:rand(5,89),text:`GOL ${f.away}!`});for(let i=0;i<7;i++)goals.push({min:rand(4,88),text:pick(['Tiro dalla distanza, palla fuori.','Il portiere blocca in sicurezza.','Possesso prolungato a centrocampo.','Ripartenza pericolosa.','Intervento decisivo della difesa.'])});goals.sort((a,b)=>a.min-b.min);events.push(...goals,{min:90,text:'Triplice fischio.'});state.match={fixture:state.fixtures.indexOf(f),result,events,index:0}}screen='match';persist();render()}

function completeMatch(){let m=state.match;if(!m)return;let f=state.fixtures[m.fixture];if(!f.played){f.played=true;f.score=m.result;state.round++;let ours=f.home===state.club?m.result[0]:m.result[1],theirs=f.home===state.club?m.result[1]:m.result[0];let players=state.players.slice().sort(()=>Math.random()-.5).slice(0,11);for(let p of players){p.apps++;p.minutes+=rand(65,90);p.form=Math.max(35,Math.min(99,p.form+rand(-4,5)));p.rating=Math.round((p.rating*(p.apps-1)+rand(58,82)/10)/p.apps*10)/10}for(let i=0;i<ours;i++){let scorer=pick(players.filter(p=>p.role!=='POR')||players);scorer.goals++;let helpers=players.filter(p=>p.id!==scorer.id&&p.role!=='POR');if(helpers.length&&Math.random()<.65)pick(helpers).assists++}let keeper=players.find(p=>p.role==='POR');if(keeper)keeper.conceded=(keeper.conceded||0)+theirs;log(`Partita: ${f.home} ${m.result[0]}-${m.result[1]} ${f.away}`);if(ours>theirs)state.relations.fans=Math.min(100,state.relations.fans+2);if(ours<theirs)state.relations.fans=Math.max(0,state.relations.fans-2)}state.match=null;screen='home';persist();render()}
function advance(){if(today()){toast('Prima segui la partita di oggi');return}state.day=plus(state.day,1);let due=state.tasks.filter(t=>t.due<=state.day);state.tasks=state.tasks.filter(t=>t.due>state.day);for(let t of due){if(t.type==='scouting'){let p=[...state.players,...state.others].find(x=>x.id===t.data);if(p){state.scoutReports.push({id:p.id,day:state.day});news(`Rapporto pronto su ${p.name}. Valore stimato: ${euro(p.value)}. Forma: ${p.form}/100.`,'Scouting')}}else if(t.type==='meeting'){news(`Ho analizzato la tua richiesta: ${t.data}. Possiamo approfondire la situazione.`, 'Direzione sportiva')}else if(t.type==='sponsor'){let amount=rand(15,120)*1000;news(`Proposta commerciale ricevuta: ${euro(amount)} per una stagione.`, 'Ufficio sponsor');state.sponsors.push({name:'Nuovo partner '+state.sponsors.length,annual:amount,until:state.season+1})}else if(t.type==='deal'){let o=state.talks.find(x=>x.id===t.data);if(o&&o.status==='in corso'){o.status='risposta ricevuta';news(`La società ${o.owner} valuta la proposta per ${o.playerName}. Contatta il DS per proseguire.`,'Direttore sportivo')}}}if(Math.random()<.065){let type=pick(['press','finance','fans']);news(type==='press'?'Una testata locale chiede un’intervista sul progetto sportivo.':type==='finance'?'Il responsabile finanziario propone una verifica del budget invernale.':'I tifosi chiedono informazioni sugli obiettivi della stagione.',type==='press'?'Stampa':type==='finance'?'Finanze':'Tifoseria')}if(Math.random()<.035&&state.players.length){let p=pick(state.players.filter(p=>!p.loan)||state.players);let from=pick(CLUBS.filter(c=>c[0]!==state.club))[0];state.offers.push({id:'o'+Math.random(),player:p.id,from,amount:Math.round(p.value*(.8+Math.random()*.5)),status:'open'});news(`${from} ha presentato un'offerta per ${p.name}.`,'Mercato',true)}state.cash-=Math.round(state.players.reduce((sum,p)=>sum+p.salary,0)/365);if(state.day.slice(5)==='07-01'){state.season++;state.fixtures=[];state.round=0;state.champions.p function act(action){if(action.startsWith('nav:')){screen=action.slice(4);render();return}if(action==='new')return newCareer();if(action==='nextTutorial'){if(++tutorialStep>=4){state.tutorialDone=true;screen='home';persist()}render();return}if(action==='skipTutorial'){state.tutorialDone=true;screen='home';persist();render();return}if(action==='advance')return advance();if(action==='startmatch')return startMatch();if(action==='nextAction'){if(state.match.index>=state.match.events.length-1)return completeMatch();state.match.index++;persist();render();return}if(action==='finishMatch')return completeMatch();if(action==='calendar'){document.getElementById('app').innerHTML=calendar();return}if(action.startsWith('tab:')){marketTab=action.slice(4);render();return}if(action==='applyFilters'){search.name=document.getElementById('filterName').value.trim();search.role=document.getElementById('filterRole').value;search.club=document.getElementById('filterClub').value.trim();render();return}if(action==='clearFilters'){search={name:'',role:'',club:''};render();return}if(action.startsWith('player:')){playerId=action.slice(7);screen='player';render();return}if(action.startsWith('watch:')){let id=action.slice(6);state.watched=state.watched.includes(id)?state.watched.filter(x=>x!==id):[...state.watched,id];persist();render();return}if(action.startsWith('scout:')){let id=action.slice(6);schedule('scouting',3,id);toast('Osservatore incaricato: rapporto tra 3 giorni');persist();return}if(action.startsWith('deal:'))return deal(findPlayer());if(action.startsWith('sell:')){toast('Le offerte in entrata si gestiscono dal Mercato');return}if(action.startsWith('meet:'))return conversation(action.slice(5));if(action==='say')return handleSay();if(action.startsWith('read:')){let n=state.news.find(x=>x.id===action.slice(5));if(n)n.read=true;persist();render();return}if(action.startsWith('accept:'))return offerAction(action.slice(7),'accept');if(action.startsWith('reject:'))return offerAction(action const REAL_SOURCE='Database parziale importato da Alpha 2.3.4; nomi, squadre e ruoli non verificati singolarmente. Età, valori, ingaggi e contratti simulati.';
const oldNewCareer=newCareer;
newCareer=function(){oldNewCareer();seedRealRoster();state.threads={};state.nextReportId=1;persist();render()};
function seedRealRoster(){
 const current=state.club;
 const importedTeams=new Set(Object.keys(ROSTERS_2627_PARTIAL));
 const refounded=state.scenario==='failure';
 const makeReal=(team,entries)=>entries.map((p,i)=>{
   const level=clubMeta(team)[3]||60;
   const template=buildPlayers(team,level,1)[0];
   const role=({'P':'POR','D':'DIF','C':'CEN','A':'ATT','Portiere':'POR','Difensore':'DIF','Centrocampista':'CEN','Attaccante':'ATT'})[p.role]||p.role||'ND';
   return {...template,id:p.id||'import_'+team+'_'+i,
      name:p.name,role,team,owner:p.parent_club||team,
      loan:p.loan_end?{end:p.loan_end,parent:p.parent_club||team}:null,
      source:p.data_source||'Archivio parziale 2026/27',
      verified:!!p.verified_2026_27,
      value:p.market_value_eur||template.value,
      marketValueEstimated:!p.market_value_eur,
      stats:{pg:0,goals:0,assists:0,conceded:0,rating:0}
   };
 });
 state.others=state.others.filter(p=>!importedTeams.has(p.team));
 for(const [team,entries] of Object.entries(ROSTERS_2627_PARTIAL)){
   if(team===current){if(!refounded)state.players=makeReal(team,entries);}
   else state.others.push(...makeReal(team,entries));
 }
 state.rosterImport={origin:'Snapshot 2026/27 parziale',clubs:importedTeams.size,
 players:Object.values(ROSTERS_2627_PARTIAL).reduce((n,a)=>n+a.length,0),
 verifiedTeams:4,partial:true};
}
function ensureThreads(){if(!state.threads)state.threads={};if(!state.nextReportId)state.nextReportId=1;}
function addActionableReport(who,title,body,subject){
 ensureThreads();let id='r'+state.nextReportId++;
 state.threads[id]={id,who,title,body,subject:subject||'',status:'awaiting',messages:[{from:'Società',text:body,day:state.day}],created:state.day};
 news(title+' — '+body,who==='ds'?'Direttore sportivo':who==='scout'?'Scouting':who==='sponsor'?'Ufficio sponsor':'Società',true);
 let n=state.news[0];n.reportId=id;
 return id;
}
const oldAdvance=advance;
advance=function(){
 if(today())return oldAdvance();
 let dueTasks=state.tasks.filter(t=>t.due<=plus(state.day,1));
 let priorNews=state.news.map(n=>n.id);
 oldAdvance();
 for(let t of dueTasks){
  let latest=state.news.find(n=>!priorNews.includes(n.id)&&!n.reportId&&((t.type==='scouting'&&n.who==='Scouting')||(t.type==='meeting'&&n.who==='Direzione sportiva')||(t.type==='sponsor'&&n.who==='Ufficio sponsor')||(t.type==='deal'&&n.who==='Direttore sportivo')));
  if(!latest)continue;
  let who=t.type==='scouting'?'scout':t.type==='sponsor'?'sponsor':'ds';
  let id=addActionableReport(who,({scouting:'Rapporto scouting pronto',meeting:'Risposta alla tua direttiva',sponsor:'Proposta sponsor da valutare',deal:'Aggiornamento trattativa'})[t.type]||'Aggiornamento',latest.text,t.data);
  // Keep the original informative notification as history, but remove duplicate unread alert.
  latest.read=true;
 }
 persist();render();
};
const oldAgenda=agenda;
agenda=function(){
 ensureThreads();let pending=Object.values(state.threads).filter(t=>t.status==='awaiting');
 let section=pending.length?`<h3>Richiedono una decisione <span class="tag red">${pending.length}</span></h3>`+pending.map(t=>card(`<div class="row"><b>${escapeHTML(t.title)}</b><span class="tag red">Da gestire</span></div><p class="note">${escapeHTML(t.body)}</p><button class="btn" data-action="report:${t.id}">Apri e rispondi</button>`)).join(''):'';
 return oldAgenda().replace('<h3>Comunicazioni</h3>',section+'<h3>Comunicazioni</h3>');
};
let activeReportId=null;
const oldConversationView=conversationView;
conversationView=function(){
 if(!activeReportId)return oldConversationView();
 ensureThreads();let t=state.threads[activeReportId];if(!t)return oldConversationView();
 return `<button class="btn alt sm" data-action="nav:agenda">← Agenda</button>${head(t.title,'Conversazione persistente · '+t.created)}
 ${card(`<div class="stack">${t.messages.map(m=>`<div class="event"><b>${escapeHTML(m.from)}</b><div class="note">${escapeHTML(m.text)}</div><span class="tiny muted">${escapeHTML(m.day)}</span></div>`).join('')}</div>`)}
 ${card(`<div class="event"><b>Domanda del collaboratore</b><p>${escapeHTML(t.who==='scout'?'Quale dei profili vuole approfondire e come desidera procedere?':t.who==='sponsor'?'Vuole approfondire le condizioni economiche o avviare la trattativa?':'Come desidera procedere alla luce di questo aggiornamento?')}</p></div><label class="field">La tua risposta<textarea id="reportReply" ></textarea></label><div class="stack" style="margin-top:12px"><button class="btn" data-action="reportReply:${t.id}">Invia risposta</button><button class="btn alt" data-action="reportLater:${t.id}">Deciderò più avanti</button><button class="btn ghost" data-action="reportClose:${t.id}">Chiudi il caso</button></div>`)}`;
};
const oldAct=act;
act=function(action){
 if(action.startsWith('report:')){activeReportId=action.slice(7);screen='conversation';render();return;}
 if(action.startsWith('reportReply:')){
  ensureThreads();let id=action.slice(12),t=state.threads[id],msg=document.getElementById('reportReply')?.value.trim();if(!t||!msg)return toast('Scrivi una risposta');
  t.messages.push({from:state.president,text:msg,day:state.day});t.status='working';
  if(t.who==='scout'){
   let p=[...state.players,...state.others].find(x=>x.id===t.subject);
   if(p&&!state.watched.includes(p.id))state.watched.push(p.id);
  }
  state.tasks.push({type:'followup',due:plus(state.day,rand(2,4)),data:id});
  t.messages.push({from:'Segreteria',text:'La tua risposta è stata inoltrata. Riceverai un nuovo aggiornamento tra alcuni giorni.',day:state.day});
  log('Direttiva successiva: '+msg);activeReportId=null;screen='agenda';persist();render();return;
 }
 if(action.startsWith('reportLater:')){let t=state.threads?.[action.slice(12)];if(t)t.status='awaiting';activeReportId=null;screen='agenda';persist();render();return;}
 if(action.startsWith('reportClose:')){let t=state.threads?.[action.slice(12)];if(t)t.status='closed';activeReportId=null;screen='agenda';persist();render();return;}
 if(action.startsWith('nav:'))activeReportId=null;
 return oldAct(action);
};
const advanceWithReports=advance;
advance=function(){
 if(today())return advanceWithReports();
 let followups=state.tasks.filter(t=>t.type==='followup'&&t.due<=plus(state.day,1));
 state.tasks=state.tasks.filter(t=>!followups.includes(t));
 advanceWithReports();
 for(let f of followups){let t=state.threads?.[f.data];if(!t)continue;
  let response=t.who==='scout'?'Ho aggiornato gli osservati e predisposto un approfondimento. Possiamo valutare la prossima mossa.':t.who==='sponsor'?'Ho esaminato la richiesta: possiamo proseguire la negoziazione commerciale.':'Ho ricevuto il riscontro. Possiamo valutare le alternative e decidere come procedere.';
  t.messages.push({from:'Collaboratore',text:response,day:state.day});t.body=response;t.title='Nuovo aggiornamento · '+t.title;t.status='awaiting';
  news(t.title+' — '+response,'Segreteria',true);state.news[0].reportId=t.id;
 }
 persist();render();
};
const agendaWithReports=agenda;
agenda=function(){
 let html=agendaWithReports();
 // Hide the read-only action for messages that belong to an actionable conversation.
 for(let n of state.news.filter(n=>n.reportId)){
  html=html.replace(`data-action="read:${n.id}"`,`data-action="report:${n.reportId}"`);
  html=html.replace(`data-action="report:${n.reportId}">Segna come letta</button>`,`data-action="report:${n.reportId}">Apri colloquio</button>`);
 }
 return html;
};
const oldPlayer=player;
player=function(){let html=oldPlayer(),p=findPlayer();return p&&p.source?html.replace('Le schede di questa build utilizzano giocatori dimostrativi, non statistiche',`Fonte nominativo: ${escapeHTML(p.source)}. Valori, salari, contratti e statistiche di gioco sono simulati. Altri calciatori restano dimostrativi. Le schede di questa build utilizzano giocatori dimostrativi, non statistiche`):html};

document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el)act(el.dataset.action)});document.addEventListener('change',async e=>{if(e.target.id==='newclub'){let m=clubMeta(e.target.value);document.getElementById('newleague').value=m[1];document.getElementById('newregion').value=m[2]}if(e.target.id==='import'){try{let obj=JSON.parse(await e.target.files[0].text());if(obj.version!==3||!Array.isArray(obj.players)||!Array.isArray(obj.fixtures))throw Error('Formato non compatibile');state=obj;persist();screen='home';render();toast('Carriera importata')}catch(err){toast('Impossibile importare il salvataggio')}}});try{let saved=localStorage.getItem(KEY);if(saved){let obj=JSON.parse(saved);if(obj.version===3){state=obj;ensureThreads();if(!state.rosterImport)seedRealRoster();screen=state.tutorialDone?'home':'tutorial'}}}catch(e){console.error(e)}render();
</script></body></html>
