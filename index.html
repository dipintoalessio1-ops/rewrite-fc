}
function startMatch(){let f=today();if(!f){toast('Nessuna partita da disputare oggi');return}if(!state.match){let result=simulateScore(f.home,f.away),events=[{min:1,text:'Fischio d’inizio.'}];let goals=[];for(let i=0;i<result[0];i++)goals.push({min:rand(5,89),text:`GOL ${f.home}!`});for(let i=0;i<result[1];i++)goals.push({min:rand(5,89),text:`GOL ${f.away}!`});for(let i=0;i<7;i++)goals.push({min:rand(4,88),text:pick(['Tiro dalla distanza, palla fuori.','Il portiere blocca in sicurezza.','Possesso prolungato a centrocampo.','Ripartenza pericolosa.','Intervento decisivo della difesa.'])});goals.sort((a,b)=>a.min-b.min);events.push(...goals,{min:90,text:'Triplice fischio.'});state.match={fixture:state.fixtures.indexOf(f),result,events,index:0}}screen='match';persist();render()}
function match(){let m=state.match;if(!m){screen='home';return home()}let f=state.fixtures[m.fixture],shown=m.events.slice(0,m.index+1),homeGoals=shown.filter(e=>e.text===`GOL ${f.home}!`).length,awayGoals=shown.filter(e=>e.text===`GOL ${f.away}!`).length;return `${head('Diretta partita',`${f.home} – ${f.away}`)}${card(`<div class="center muted small">${shown.at(-1)?.min||1}' · ${escapeHTML(state.league)}</div><div class="score">${homeGoals} – ${awayGoals}</div><div class="center muted small">${escapeHTML(f.home)} · ${escapeHTML(f.away)}</div>`)}${card(shown.slice().reverse().map(e=>`<div class="event"><b>${e.min}'</b> ${escapeHTML(e.text)}</div>`).join(''))}<div class="stack">${btn(m.index===m.events.length-1?'Termina partita':'Prossima azione','nextAction')}${btn('Vai al risultato','finishMatch',true)}</div>`}
function completeMatch(){let m=state.match;if(!m)return;let f=state.fixtures[m.fixture];if(!f.played){f.played=true;f.score=m.result;for(const other of state.fixtures){if(other.round===f.round&&!other.played&&other.home!==state.club&&other.away!==state.club){other.score=simulateScore(other.home,other.away);other.played=true}}state.round++;let ours=f.home===state.club?m.result[0]:m.result[1],theirs=f.home===state.club?m.result[1]:m.result[0];let players=state.players.slice().sort(()=>Math.random()-.5).slice(0,11);for(let p of players){p.apps++;p.minutes+=rand(65,90);p.form=Math.max(35,Math.min(99,p.form+rand(-4,5)));p.rating=Math.round((p.rating*(p.apps-1)+rand(58,82)/10)/p.apps*10)/10}for(let i=0;i<ours;i++)pick(players).goals++;log(`Partita: ${f.home} ${m.result[0]}-${m.result[1]} ${f.away}`);if(ours>theirs)state.relations.fans=Math.min(100,state.relations.fans+2);if(ours<theirs)state.relations.fans=Math.max(0,state.relations.fans-2)}state.lastResult={home:f.home,away:f.away,score:m.result.slice(),day:state.day};state.match=null;screen='result';persist();render()}
function resultPage(){const r=state.lastResult;if(!r)return home();return `${head('Risultato finale',state.league)}${card(`<div class="center muted small">TRIPLICE FISCHIO</div><div class="center" style="font-weight:800;font-size:19px;margin:15px 0">${escapeHTML(r.home)} – ${escapeHTML(r.away)}</div><div class="score">${r.score[0]} – ${r.score[1]}</div><p class="center muted small">${escapeHTML(r.day)}</p>`)}${btn('Visualizza la classifica','nav:sport')}${btn('Torna alla Home','nav:home',true)}`}
function advance(){if(today()){toast('Prima segui la partita di oggi');return}state.day=plus(state.day,1);let due=state.tasks.filter(t=>t.due<=state.day);state.tasks=state.tasks.filter(t=>t.due>state.day);for(let t of due){if(t.type==='scouting'){let p=[...state.players,...state.others].find(x=>x.id===t.data);if(p){state.scoutReports.push({id:p.id,day:state.day});news(`Rapporto pronto su ${p.name}. Valore stimato: ${euro(p.value)}. Forma: ${p.form}/100.`,'Scouting')}}else if(t.type==='meeting'){news(`Ho analizzato la tua richiesta: ${t.data}. Possiamo approfondire la situazione.`, 'Direzione sportiva')}else if(t.type==='sponsor'){let amount=rand(15,120)*1000;news(`Proposta commerciale ricevuta: ${euro(amount)} per una stagione.`, 'Ufficio sponsor');state.sponsors.push({name:'Nuovo partner '+state.sponsors.length,annual:amount,until:state.season+1})}else if(t.type==='deal'){let o=state.talks.find(x=>x.id===t.data);if(o&&o.status==='in corso'){o.status='risposta ricevuta';news(`La società ${o.owner} valuta la proposta per ${o.playerName}. Contatta il DS per proseguire.`,'Direttore sportivo')}}}if(Math.random()<.065){let type=pick(['press','finance','fans']);news(type==='press'?'Una testata locale chiede un’intervista sul progetto sportivo.':type==='finance'?'Il responsabile finanziario propone una verifica del budget invernale.':'I tifosi chiedono informazioni sugli obiettivi della stagione.',type==='press'?'Stampa':type==='finance'?'Finanze':'Tifoseria')}if(Math.random()<.035&&state.players.length){let p=pick(state.players.filter(p=>!p.loan)||state.players);let from=pick(CLUBS.filter(c=>c[0]!==state.club))[0];state.offers.push({id:'o'+Math.random(),player:p.id,from,amount:Math.round(p.value*(.8+Math.random()*.5)),status:'open'});news(`${from} ha presentato un'offerta per ${p.name}.`,'Mercato',true)}state.cash-=Math.round(state.players.reduce((sum,p)=>sum+p.salary,0)/365);if(state.day.slice(5)==='07-01'){state.season++;state.fixtures=[];state.round=0;state.champions.push({year:state.season-1,champion:standings()[0]?.name||state.club});log(`Fine stagione ${state.season-1}. Inizia una nuova stagione.`);news('Stagione conclusa. La gestione delle competizioni pluriennali è ancora in sviluppo.','Segreteria')}persist();render()}
function conversation(who){let whoName={ds:'Marco Bellini · Direttore sportivo',coach:'Lorenzo Ferretti · Allenatore',scout:'Davide Serra · Scouting',press:'Ufficio stampa'}[who]||who;game={who};screen='conversation';render()}

function meetingContext(who){
 const completed=state.fixtures.filter(f=>f.played&&(f.home===state.club||f.away===state.club));
 const losses=completed.filter(f=>{let own=f.home===state.club?f.score[0]:f.score[1],opp=f.home===state.club?f.score[1]:f.score[0];return own<opp}).length;
 const played=completed.length;
 if(who==='ds')return {intro:played>5&&losses>played/2?'Presidente, i risultati stanno complicando il nostro progetto. Vuole intervenire sul mercato o confermare la strategia?':'Presidente, quali priorità vuole dare alla direzione sportiva?',questions:['Quali reparti dobbiamo rinforzare?','Ci sono giocatori da dichiarare incedibili?','Come possiamo migliorare il bilancio?']};
 if(who==='coach')return {intro:played>3&&losses>=3?'Presidente, le ultime prestazioni non sono state sufficienti. Come vuole che affrontiamo questa fase?':'Presidente, sono a disposizione per parlare della squadra e degli obiettivi.',questions:['Come valuta la condizione della rosa?','Quali sono gli obiettivi per le prossime partite?','Servono rinforzi in qualche reparto?']};
 if(who==='scout')return {intro:'Presidente, su quali profili vuole concentrare la nostra rete di osservatori?',questions:['Cerchiamo giovani di prospettiva','Cerchiamo giocatori pronti per la prima squadra','Quali ruoli sono scoperti?']};
 return {intro:played===0?'Presidente, la stagione deve ancora cominciare. Quale messaggio vuole dare alla stampa?':losses>played/2?'Presidente, i giornalisti chiedono un commento sull’andamento recente. Come vuole rispondere?':'Presidente, la stampa attende una sua valutazione della stagione.',questions:['Quali obiettivi comunichiamo?','Come valuta il lavoro dello staff?','Cosa vuole dire ai tifosi?']};
}
function conversationView(){let who=game?.who||'ds',ctx=meetingContext(who);return `<button class="btn alt sm" data-action="nav:agenda">← Agenda</button>${head('Colloquio',({ds:'Direttore sportivo',coach:'Allenatore',scout:'Responsabile scouting',press:'Conferenza stampa'})[who]||who)}${card(`<p>${escapeHTML(ctx.intro)}</p><p class="muted small">Argomenti possibili:</p><div class="stack">${ctx.questions.map((q,i)=>`<button class="btn alt" data-action="topic:${i}">${escapeHTML(q)}</button>`).join('')}</div><label class="field" style="margin-top:14px">La tua risposta o domanda<textarea id="say" placeholder="Scrivi liberamente cosa vuoi dire..."></textarea></label><button class="btn" data-action="say">Invia risposta</button>`)}${state.logs.filter(x=>x.who===who).slice(-8).reverse().map(l=>card(`<b>${escapeHTML(l.from)}</b><p class="note">${escapeHTML(l.text)}</p>`)).join('')}`}

function handleSay(){let val=document.getElementById('say')?.value.trim();if(!val)return toast('Scrivi un messaggio');let who=game?.who||'ds';state.logs.push({who,from:state.president,text:val});let lower=val.toLowerCase(),reply='Ho ricevuto la tua indicazione. La terrò presente nelle prossime valutazioni.';if(/osserv|scout|cerca|giovan|profil/.test(lower)){schedule('scouting',3,pick(state.others).id);reply='Avvio la ricerca. Ti farò avere un primo rapporto entro tre giorni.'}else if(/incedibil|non vend|blind/.test(lower)){state.policy='Non cedere i giocatori indicati senza consultare il presidente';reply='Ricevuto: prima di trattare una cessione ti consulterò. La direttiva è stata registrata.'}else if(/sponsor|partner/.test(lower)){schedule('sponsor',5,null);reply='Contatteremo potenziali partner. Ti aggiornerò entro cinque giorni.'}else if(/budget|bilancio/.test(lower)){reply=`Al momento la liquidità è ${euro(state.cash)}. Eviterei impegni che non possiamo sostenere.`}else if(/formaz|tattic|partit/.test(lower)){reply='La gestione tecnica rimane di mia competenza, ma terrò conto degli obiettivi societari.'}else if(/intervist|giornal|stampa/.test(lower)){state.relations.press=Math.min(100,state.relations.press+1);reply='Preparerò una comunicazione coerente con il messaggio che hai scelto.'}else{schedule('meeting',2,val);reply='Valuterò la tua proposta e tornerò da te con un aggiornamento.'}state.logs.push({who,from:who==='coach'?'Allenatore':who==='press'?'Ufficio stampa':'Direzione sportiva',text:reply});log(`Direttiva al ${who}: ${val}`);persist();render()}
function deal(p){if(p.team===state.club&&p.owner===state.club)return toast('Il giocatore è già di tua proprietà');let id='d'+Math.random(),text=p.loan&&p.team!==p.owner?`Prestito in corso a ${p.team}: serviranno accordi con ${p.owner} e, se necessario, ${p.team}.`:`Avviato contatto con ${p.owner}.`;state.talks.push({id,player:p.id,playerName:p.name,owner:p.owner,text,status:'in corso'});schedule('deal',3,id);news(text,'Direttore sportivo');log(`Aperta trattativa per ${p.name}.`);marketTab='deals';screen='market';persist();render()}
