<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101719"><title>REWRITE FC — President's Office</title><style>
:root{--bg:#101719;--panel:#182224;--line:#2b393a;--text:#f0f5ef;--muted:#99aaa6;--lime:#c4f27d;--red:#f39a91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:4;background:#101719ed;border-bottom:1px solid var(--line);padding:16px max(18px,calc((100vw - 1080px)/2))}header .brand{font-weight:850;letter-spacing:.14em;font-size:13px}header .sub{font-size:11px;color:var(--muted);letter-spacing:.12em}.wrap{max-width:1080px;margin:auto;padding:22px 18px 95px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--lime);font-weight:750}.hero{font-size:clamp(28px,5vw,44px);letter-spacing:-.05em;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:17px}.card h3{font-size:15px;margin:0 0 10px}.metric{font-size:27px;font-weight:750;letter-spacing:-.04em}.small{font-size:12px}.section{margin:24px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:#263436;color:var(--text);border-radius:10px;padding:10px 13px;font-weight:650}.btn.primary{background:var(--lime);color:#132016;border-color:var(--lime)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.35;cursor:not-allowed}.btnrow{display:flex;flex-wrap:wrap;gap:8px}.nav{display:flex;gap:5px;overflow-x:auto;padding-top:12px}.nav button{background:transparent;border:0;color:var(--muted);padding:8px 13px;border-radius:9px;white-space:nowrap}.nav button.active{background:#2b3935;color:var(--lime)}.list{display:grid;gap:8px}.item{padding:13px;border:1px solid var(--line);border-radius:11px;display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:11px;border:1px solid var(--line);padding:4px 8px;border-radius:99px;color:var(--muted)}.bar{height:6px;border-radius:5px;background:#344141;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--lime)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}select,input{background:#101719;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px}tr.me{color:var(--lime)}.notice{border-left:3px solid var(--lime);padding:10px 14px;background:#202d29;border-radius:0 10px 10px 0;margin:14px 0}.empty{padding:26px;color:var(--muted);text-align:center}.foot{font-size:12px;color:var(--muted);padding:25px 0}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:450px;width:calc(100% - 32px)}dialog::backdrop{background:#000b}dialog h3{margin-top:0}dialog p{color:var(--muted)}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.metric{font-size:23px}.wrap{padding-top:16px}.card{padding:13px}}@media(max-width:350px){.grid{grid-template-columns:1fr 1fr}.metric{font-size:19px}}

textarea{font:inherit;width:100%;min-height:86px;resize:vertical;background:#101719;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px}.story{border:1px solid #52654c;background:linear-gradient(125deg,#24352c,#182224);padding:20px;border-radius:17px}.story h2{font-size:23px;letter-spacing:-.035em;margin:8px 0}.story p{color:#c9d6ce}.story .btn{margin-top:6px}.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}.mutedbtn{opacity:.7}.timeline{border-left:1px solid var(--line);padding-left:14px}.timeline>div{margin:12px 0}.statline{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.accent{color:var(--lime)}.bad{color:var(--red)}.wide{grid-column:1/-1}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:700px){.two{grid-template-columns:1fr}.story{padding:15px}.nav{scrollbar-width:none}}
</style></head><body><header><div class="top"><div><div class="brand">REWRITE FC <span style="color:var(--lime)">/ PRESIDENT'S OFFICE</span></div><div class="sub">SIMULAZIONE NARRATIVA · BUILD 0.4</div></div><button class="btn small" onclick="resetGame()">Nuova carriera</button></div><nav class="nav" id="nav"></nav></header><main class="wrap" id="app"></main><dialog id="modal"><div id="modalBody"></div><div class="btnrow" style="margin-top:16px;justify-content:flex-end"><button class="btn" onclick="document.getElementById('modal').close()">Chiudi</button></div></dialog><script>
'use strict';
// Gioco autonomo: squadre reali come nomi, calciatori e situazioni narrative fittizi.
const TEAMS=[['Bari',69,22],['Benevento',76,29],['Catania',74,27],['Salernitana',73,25],['Crotone',70,21],['Cosenza',68,19],['Casertana',66,17],['Potenza',65,15],['Cerignola',66,16],['Monopoli',65,15],['Foggia',63,14],['Altamura',60,10],['Casarano',62,12],['Cavese',61,11],['Sorrento',59,10],['Latina',61,11],['Giugliano',61,11],['Picerno',60,10],['Siracusa',60,10],['Trapani',67,18]];
const FIRST=['Andrea','Luca','Marco','Alessandro','Francesco','Giuseppe','Antonio','Davide','Simone','Nicola','Matteo','Federico','Daniele','Emanuele','Gabriele','Pietro','Riccardo','Vincenzo'];
const LAST=['Romano','Rossi','Esposito','Greco','Ferrara','Marino','Rizzo','Caruso','De Luca','Vitale','Leone','Costa','Conti','Gallo','Longo','Santoro','Moretti','Serra','Fiore','Palmieri','Mancini'];
const POS=['POR','POR','POR','DIF','DIF','DIF','DIF','DIF','DIF','DIF','CEN','CEN','CEN','CEN','CEN','CEN','CEN','ATT','ATT','ATT','ATT','ATT'];
const $=id=>document.getElementById(id), clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),fmt=n=>'€ '+Number(n).toFixed(2)+'M',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){let t=seed>>>0;return ()=>{t+=0x6D2B79F5;let x=t;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return ((x^(x>>>14))>>>0)/4294967296}}
function makePlayers(team){const r=rng(804+team*719);return POS.map((pos,i)=>{let overall=clamp(Math.round(TEAMS[team][1]-10+r()*18),46,88);return {id:team*1000+i,name:FIRST[Math.floor(r()*FIRST.length)]+' '+LAST[Math.floor(r()*LAST.length)],pos,age:18+Math.floor(r()*16),overall,morale:65+Math.floor(r()*25),contract:2027+Math.floor(r()*4),wage:+(.04+(overall-45)*.005).toFixed(2),value:+(.1+(overall-45)*.13+r()*.6).toFixed(2),apps:0,goals:0,listed:false,loan:false,discontent:0}})}
function fixture(n){let t=Array.from({length:n},(_,i)=>i),out=[];for(let k=0;k<n-1;k++){let pairs=[];for(let j=0;j<n/2;j++)pairs.push(k%2?[t[n-1-j],t[j]]:[t[j],t[n-1-j]]);out.push(pairs);t=[t[0],t[n-1],...t.slice(1,n-1)]}return out.concat(out.map(round=>round.map(([a,b])=>[b,a])))}
function initial(team){let r=rng(991+team),rivals=TEAMS.map((t,id)=>({id,quality:t[1],budget:t[2],coach:60+Math.floor(r()*26),mood:60+Math.floor(r()*25),changes:0}));return {version:4,team,week:0,year:2026,balance:TEAMS[team][2],fans:65,board:68,coach:70,ds:65,scout:61,youth:45,facilities:45,formation:'4-3-3',approach:'equilibrato',trust:65,press:60,staffTalk:{},sponsor:null,players:makePlayers(team),rivals,fixtures:fixture(20),results:[],cup:{stage:0,alive:true,history:[]},market:[],inbox:[],decisions:[],news:[],last:null,report:null,ending:false,serial:0}}
let s=null,tab='desk';try{let x=JSON.parse(localStorage.getItem('rewrite_president_v4'));if(x&&x.version===4&&Array.isArray(x.players))s=x}catch(e){}
const save=()=>{if(s)try{localStorage.setItem('rewrite_president_v4',JSON.stringify(s))}catch(e){}};
const b=(label,action,primary=false)=>`<button class="btn ${primary?'primary':''}" onclick="${action}">${label}</button>`;
function notice(title,body){$('modalBody').innerHTML=`<h3>${esc(title)}</h3><p>${body}</p>`;$('modal').showModal()}
function news(msg){s.news.unshift({week:s.week,msg});s.news=s.news.slice(0,55)}
function change(key,amount){s[key]=clamp(Math.round(s[key]+amount),0,100)}
function record(title,choice,effects){s.decisions.unshift({week:s.week,title,choice,effects});s.decisions=s.decisions.slice(0,100);news(`${title}: ${choice}. ${effects}`)}
function pushEvent(e){s.inbox.push({...e,id:++s.serial,created:s.week});}
function seedOpening(){pushEvent({type:'strategy',title:'Il primo incontro con il direttore sportivo',from:'Direttore sportivo',text:'Presidente, dobbiamo stabilire cosa viene prima: risultati immediati, sostenibilità economica o valorizzazione dei giovani. Da questa scelta dipenderanno mercato, staff e aspettative.',choices:[['Puntiamo alla promozione','promotion'],['Bilancio sostenibile','finance'],['Costruiamo sui giovani','youth']]});pushEvent({type:'coach',title:'Il piano dell’allenatore',from:'Allenatore',text:'Ho bisogno di sapere che calcio vogliamo proporre. Possiamo cercare di imporre il gioco, oppure dare priorità alla solidità.',choices:[['Gioco offensivo','attack'],['Equilibrio prima di tutto','balanced'],['Prudenza e organizzazione','defend']]})}
function chooseTeam(id){s=initial(id);seedOpening();tab='desk';save();render()}
function resetGame(){if(confirm('Vuoi cancellare la carriera corrente e ricominciare?')){s=null;localStorage.removeItem('rewrite_president_v4');tab='desk';render()}}
function rating(id){let x=s.rivals[id],n=x.quality+(x.coach-70)*.09+(x.mood-70)*.025;if(id===s.team){let p=[...s.players].sort((a,b)=>b.overall-a.overall).slice(0,11),avg=p.reduce((a,z)=>a+z.overall,0)/p.length;let morale=p.reduce((a,z)=>a+z.morale,0)/p.length;n=n*.25+avg*.75+(s.coach-70)*.09+(morale-70)*.045+(s.facilities-45)*.025+(s.approach==='offensivo'?.5:0)}return n}
function poisson(l,r){let k=0,p=1,L=Math.exp(-Math.max(.08,l));do{k++;p*=r()}while(p>L&&k<12);return k-1}
function score(a,b,seed){let r=rng(seed),delta=rating(a)-rating(b),h=clamp(1.3+delta*.077,.18,3.5),v=clamp(1.03-delta*.077,.15,3.3);return [poisson(h,r),poisson(v,r)]}
function table(){let rows=TEAMS.map((t,id)=>({id,name:t[0],g:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));for(const x of s.results){let a=rows[x.a],b=rows[x.b];a.g++;b.g++;a.gf+=x.ga;a.ga+=x.gb;b.gf+=x.gb;b.ga+=x.ga;if(x.ga>x.gb){a.w++;a.pts+=3;b.l++}else if(x.ga<x.gb){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}}return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function nextMatch(){return s.fixtures[s.week]?.find(pair=>pair.includes(s.team))}
function tickRivals(){let r=rng(8001+s.week*201);for(let x of s.rivals){if(x.id===s.team)continue;if(r()<.14){let d=r()<.5?-1:1;x.quality=clamp(x.quality+d,52,83);x.changes++;if(r()<.3)news(`${TEAMS[x.id][0]}: operazione di mercato completata; la forza della rosa è cambiata.`)}if(r()<.04){x.coach=55+Math.floor(r()*35);news(`${TEAMS[x.id][0]} cambia allenatore dopo una riunione societaria.`)}x.mood=clamp(x.mood+(r()-.5)*8,35,92)}}
function weekEvents(){let w=s.week,r=rng(34000+w*73+s.team);if(w===2)pushEvent({type:'finance',from:'Direzione finanziaria',title:'I conti della stagione',text:'Il costo della rosa è elevato rispetto agli incassi previsti. Propongo di bloccare le spese accessorie oppure investire per sostenere la competitività.',choices:[['Taglia le spese','cut'],['Mantieni il piano','steady'],['Investi sulla squadra','invest']]});if(w===5||w===16||w===27){let p=s.players.filter(p=>p.pos==='ATT').sort((a,b)=>b.overall-a.overall)[0];if(p)pushEvent({type:'agent',playerId:p.id,from:'Procuratore',title:'Il procuratore vuole parlare',text:`${p.name} ritiene di meritare un adeguamento. Il suo contratto scade nel ${p.contract}. Un rifiuto potrebbe compromettere il rapporto con il giocatore.`,choices:[['Proponi rinnovo','renew'],['Rimanda il colloquio','delay'],['Mettilo sul mercato','list']]})}if(w===9||w===22)pushEvent({type:'press',from:'Ufficio stampa',title:'Conferenza stampa delicata',text:'I giornalisti chiedono quale sia il vero obiettivo della società. Una dichiarazione ambiziosa può entusiasmare i tifosi, ma aumenterà la pressione.',choices:[['Prometti risultati importanti','promise'],['Difendi il progetto a lungo termine','longterm'],['Non fare promesse','neutral']]});if(w===12||w===30)pushEvent({type:'academy',from:'Responsabile vivaio',title:'Il settore giovanile chiede risorse',text:'Con un investimento mirato possiamo migliorare le strutture e individuare talenti, ma sottrarremo liquidità al mercato.',choices:[['Investi €0.75M','fund'],['Rinvia l’investimento','postpone']]});if(w===19)pushEvent({type:'market',from:'Direttore sportivo',title:'Apertura del mercato invernale',text:'Possiamo rafforzare la rosa oppure conservare le risorse. Il nostro scouting ha già individuato alcuni profili.',choices:[['Stanzia €1.5M per il mercato','allocate'],['Nessuna spesa straordinaria','hold']]});if(w>4&&w%8===0&&r()<.6)pushEvent({type:'fans',from:'Rappresentanti dei tifosi',title:'La tifoseria vuole un confronto',text:'I gruppi organizzati chiedono maggior dialogo e un impegno concreto per il futuro della società.',choices:[['Organizza un incontro','meet'],['Comunicato ufficiale','statement'],['Non intervenire','ignore']]})}
function respond(id,index){let e=s.inbox.find(x=>x.id===id);if(!e)return;let code=e.choices[index]?.[1];if(!code)return;let extra='',p=s.players.find(p=>p.id===e.playerId);switch(code){case'promotion':change('fans',8);change('board',-2);s.strategy='promozione';extra='Aspettative sportive elevate';break;case'finance':s.balance+=1;change('fans',-4);s.strategy='sostenibilità';extra='Maggior disciplina finanziaria';break;case'youth':change('youth',9);s.strategy='giovani';extra='Settore giovanile valorizzato';break;case'attack':s.approach='offensivo';change('coach',4);extra='Approccio offensivo';break;case'balanced':s.approach='equilibrato';change('coach',3);extra='Approccio equilibrato';break;case'defend':s.approach='prudente';change('coach',2);extra='Approccio prudente';break;case'cut':s.balance+=.65;change('coach',-5);extra='Risparmi €0.65M, allenatore contrariato';break;case'steady':change('board',2);extra='Piano confermato';break;case'invest':s.balance-=1.1;change('coach',6);change('fans',4);extra='Investiti €1.1M';break;case'renew':if(p){s.balance-=.22;p.wage=+(p.wage*1.22).toFixed(2);p.contract+=2;p.morale=clamp(p.morale+14,0,100);extra='Rinnovo con aumento del 22%'}break;case'delay':if(p)p.morale=clamp(p.morale-11,0,100);extra='Morale del calciatore in calo';break;case'list':if(p){p.listed=true;p.morale=clamp(p.morale-7,0,100)}extra='Calciatore sul mercato';break;case'promise':change('fans',9);change('board',-4);s.pressure=(s.pressure||0)+1;extra='Entusiasmo alto, pressione aumentata';break;case'longterm':change('board',4);change('fans',2);extra='Fiducia nel progetto';break;case'neutral':change('press',-3);extra='Dichiarazione prudente';break;case'fund':s.balance-=.75;change('youth',12);change('facilities',5);extra='Vivaio e strutture migliorati';break;case'postpone':change('youth',-3);extra='Investimento rinviato';break;case'allocate':s.balance-=.15;change('ds',5);extra='Budget mercato prioritario, costi operativi €0.15M';break;case'hold':change('board',2);extra='Liquidità conservata';break;case'meet':change('fans',9);change('press',4);extra='Dialogo positivo';break;case'statement':change('fans',2);extra='Comunicazione istituzionale';break;case'ignore':change('fans',-9);extra='Rapporti con la curva deteriorati';break}
record(e.title,e.choices[index][0],extra);s.inbox=s.inbox.filter(x=>x.id!==id);save();render()}
function playWeek(){if(s.week>=38)return;if(s.inbox.length){notice('Decisioni in sospeso','Prima di giocare devi rispondere alle comunicazioni presenti sulla scrivania. Le tue scelte influenzano la stagione.');tab='desk';render();return}let w=s.week,fixtures=s.fixtures[w],all=[];for(let i=0;i<fixtures.length;i++){let [a,b]=fixtures[i],[ga,gb]=score(a,b,40000+w*100+i*23+s.team);let x={a,b,ga,gb,week:w+1};s.results.push(x);all.push(x);if(a===s.team||b===s.team){s.last=x;let own=a===s.team?ga:gb,opp=a===s.team?gb:ga,d=own>opp?1:own<opp?-1:0;change('fans',d*3);change('board',d*3-(s.pressure&&d<1?2:0));change('coach',d);let r=rng(w*931+s.team);for(let p of s.players){p.apps++;p.morale=clamp(p.morale+d*2,20,99);if(p.pos==='ATT'&&own>0&&r()<own*.14)p.goals++}news(`${TEAMS[a][0]} ${ga}–${gb} ${TEAMS[b][0]} · ${d>0?'Vittoria':d<0?'Sconfitta':'Pareggio'}`)}}s.week++;let payroll=s.players.reduce((a,p)=>a+p.wage,0);s.balance=+(s.balance-(payroll/38)-.13+(s.sponsor?s.sponsor.amount/38:0)+.10).toFixed(2);if(s.week%6===0)s.balance=+(s.balance+.45).toFixed(2);tickRivals();weekEvents();s.report={kind:'league',week:s.week,all};if(s.week===38){s.ending=true;let pos=table().findIndex(x=>x.id===s.team)+1;news(`Stagione terminata: ${pos}° posto. ${pos===1?'Promozione diretta!':'Il consiglio valuta la prossima stagione.'}`)}save();tab='report';render()}
function playCup(){if(!s.cup.alive||s.cup.stage>=4)return;let stage=s.cup.stage,op=[11,6,2,1][stage];if(op===s.team)op=(op+3)%20;let [ga,gb]=score(s.team,op,78000+stage*81+s.team);let penalties=false;if(ga===gb){penalties=true;let r=rng(887+stage*55+s.team);if(r()>.5)ga++;else gb++}let x={a:s.team,b:op,ga,gb,stage:stage+1,penalties};s.cup.history.push(x);s.cup.stage++;s.cup.alive=ga>gb;if(s.cup.alive){s.balance+=.35;change('fans',3)}else change('fans',-3);news(`Coppa: ${TEAMS[s.team][0]} ${ga}–${gb} ${TEAMS[op][0]}. ${s.cup.alive?'Passaggio del turno':'Eliminazione'}`);s.report={kind:'cup',all:[x]};save();tab='report';render()}
function talk(role){if(s.staffTalk[role]===s.week){notice('Appuntamento già svolto','Hai già incontrato questo membro dello staff durante questa settimana.');return}let names={coach:'Allenatore',ds:'Direttore sportivo',scout:'Capo osservatori',finance:'Direttore finanziario'};let topics={coach:[['Come sta lo spogliatoio?',`Il morale medio è ${Math.round(s.players.reduce((a,p)=>a+p.morale,0)/s.players.length)}/100. Serve continuità nei risultati.`,2],['Cosa serve per migliorare?',`Il livello tecnico medio è ${Math.round(s.players.reduce((a,p)=>a+p.overall,0)/s.players.length)}. Un innesto di qualità farebbe la differenza.`,3]],ds:[['Situazione mercato',`Abbiamo ${fmt(s.balance)} disponibili. Ci sono ${s.players.filter(p=>p.listed).length} calciatori in lista trasferimenti.`,3],['Contratti in scadenza',`${s.players.filter(p=>p.contract<=2027).length} contratti scadono entro il 2027.`,2]],scout:[['Quali reparti rinforzare?',`Possiamo valutare candidati nella sezione Mercato. La rete scouting è a ${s.scout}/100.`,3],['Investire nello scouting?',`La rete può crescere con €0.35M di investimento.`,2]],finance:[['Situazione economica',`Disponibilità ${fmt(s.balance)}. Monte ingaggi annuo ${fmt(s.players.reduce((a,p)=>a+p.wage,0))}.`,3],['Previsione stagionale',`Senza cessioni, i costi della rosa peseranno sulle prossime settimane.`,2]]};let arr=topics[role];$('modalBody').innerHTML=`<div class="tag">Colloquio riservato</div><h3>${names[role]}</h3><p>Scegli un argomento. Il colloquio sarà registrato nel diario della presidenza.</p><div class="list">${arr.map((x,i)=>b(esc(x[0]),`finishTalk('${role}',${i})`,i===0)).join('')}</div><div class="field"><label>Oppure scrivi una domanda libera (risposta offline contestuale)</label><textarea id="freeQuestion" placeholder="Presidente, vorrei sapere..."></textarea></div>${b('Invia domanda',`freeTalk('${role}')`)}`;$('modal').showModal()}
function finishTalk(role,index,free){let names={coach:'Allenatore',ds:'Direttore sportivo',scout:'Capo osservatori',finance:'Direttore finanziario'};let lines={coach:['Il morale del gruppo dipende dai risultati e dalla gestione delle aspettative.','Per crescere dobbiamo lavorare su qualità e fiducia.'],ds:['La finestra di mercato richiede un budget sostenibile.','Dobbiamo anticipare i rinnovi per evitare svalutazioni.'],scout:['Stiamo seguendo alcuni profili compatibili con la nostra categoria.','Una rete più forte migliora la qualità dei candidati.'],finance:['La liquidità è la nostra prima garanzia di stabilità.','Gli ingaggi ricorrenti contano più del singolo acquisto.']};let response=lines[role][index%2];if(free){let q=free.toLowerCase();if(/mercat|acquist|ceder|vend/.test(q))response='Il mercato deve essere coerente con il budget e con il valore dei nostri giocatori.';else if(/tifos|stadi|pubblic/.test(q))response='Il rapporto con i tifosi è sensibile ai risultati, ma anche alla trasparenza della società.';else if(/bilanc|sold|stipend|finanz/.test(q))response='La sostenibilità richiede controllo degli stipendi e liquidità disponibile.';else if(/giovan|vivaio/.test(q))response='Investire nel vivaio è una scelta di lungo periodo; i risultati non sono immediati.'}s.staffTalk[role]=s.week;change(role==='finance'?'board':role,2);record('Colloquio con '+names[role],free?'Domanda libera: '+free:'Argomento '+(index+1),response);$('modal').close();save();notice(names[role],esc(response));render()}
function freeTalk(role){let q=$('freeQuestion')?.value.trim();if(!q){notice('Domanda mancante','Scrivi prima la tua domanda.');return}finishTalk(role,0,q.slice(0,300))}
function setApproach(x){s.approach=x;change('coach',1);news('L’allenatore adotta un approccio '+x+'.');save();render()}
function sponsor(which){if(s.sponsor){notice('Accordo attivo','Hai già firmato uno sponsor per questa stagione.');return}let opts=[{name:'Partner territoriale',amount:1.4,pressure:0},{name:'Gruppo nazionale',amount:2.7,pressure:7}];let x=opts[which];s.sponsor=x;change('board',which?4:2);if(which)change('fans',-2);record('Trattativa sponsor',x.name,`Valore annuo ${fmt(x.amount)}; bonus distribuito durante la stagione`);save();render()}
function player(id){return s.players.find(p=>p.id===id)}
function playerDetail(id){let p=player(id);if(!p)return;notice(p.name,`<div class="statline"><span>Ruolo / Età</span><b>${p.pos} · ${p.age}</b></div><div class="statline"><span>Valutazione simulata</span><b>${p.overall}/100</b></div><div class="statline"><span>Valore stimato</span><b>${fmt(p.value)}</b></div><div class="statline"><span>Ingaggio annuo</span><b>${fmt(p.wage)}</b></div><div class="statline"><span>Contratto</span><b>${p.contract}</b></div><div class="statline"><span>Presenze / Gol</span><b>${p.apps} / ${p.goals}</b></div><div class="statline"><span>Morale</span><b>${p.morale}%</b></div><div class="btnrow">${b('Rinnova contratto',`renew(${id})`,true)}${b(p.listed?'Togli dalla lista':'Lista trasferimenti',`listPlayer(${id},'listed')`)}${b(p.loan?'Togli dal prestito':'Lista prestiti',`listPlayer(${id},'loan')`)}</div>`)}
function renew(id){let p=player(id);if(!p)return;let cost=+(.15+p.wage*.6).toFixed(2);if(s.balance<cost){notice('Rinnovo impossibile','Liquidità insufficiente.');return}p.contract+=2;p.wage=+(p.wage*1.18).toFixed(2);p.morale=clamp(p.morale+10,0,100);s.balance=+(s.balance-cost).toFixed(2);record('Rinnovo',p.name,`Scadenza ${p.contract}, premio ${fmt(cost)}`);$('modal').close();save();render()}
function listPlayer(id,key){let p=player(id);if(!p)return;p[key]=!p[key];if(p[key])p[key==='loan'?'listed':'loan']=false;record('Gestione rosa',p.name,p[key]?'Inserito in '+(key==='loan'?'lista prestiti':'lista trasferimenti'):'Rimosso dalla lista');$('modal').close();save();render()}
function candidates(){let r=rng(7400+s.week*99+s.team);return Array.from({length:7},(_,i)=>{let pos=['DIF','CEN','ATT','POR'][i%4],overall=clamp(Math.round(58+r()*24),54,85),value=+(.25+(overall-55)*.16).toFixed(2);return {id:i,name:FIRST[Math.floor(r()*FIRST.length)]+' '+LAST[Math.floor(r()*LAST.length)],pos,overall,value,age:19+Math.floor(r()*13)}})}
function buy(i){let p=candidates()[i],fee=+(p.value*1.12).toFixed(2);if(s.balance<fee+1){notice('Offerta non sostenibile',`Servono almeno ${fmt(fee+1)} per operazione e riserva di liquidità.`);return}let chance=clamp(.83+(s.ds-65)*.003-(p.overall-70)*.014,.25,.95),r=rng(9921+s.week*31+i*19+s.team)();if(r>chance){record('Trattativa fallita',p.name,'Il club venditore ha rifiutato la proposta');save();render();return}let id=Math.max(...s.players.map(p=>p.id))+1;s.players.push({...p,id,contract:2029,wage:+(.06+(p.overall-50)*.005).toFixed(2),morale:76,apps:0,goals:0,listed:false,loan:false,discontent:0});s.balance=+(s.balance-fee).toFixed(2);s.market.unshift({name:p.name,type:'acquisto',fee,week:s.week});change('fans',2);record('Acquisto completato',p.name,`Costo ${fmt(fee)}`);save();render()}
function sell(id){let p=player(id);if(!p||!p.listed)return;if(s.players.length<=17){notice('Rosa insufficiente','Servono almeno 17 giocatori.');return}let r=rng(id+s.week*127),chance=.50+(s.ds-65)*.003;if(r()>chance){notice('Nessuna offerta','Al momento non è arrivata un’offerta concreta. Puoi riprovare in una prossima settimana.');return}let fee=+(p.value*(.75+r()*.5)).toFixed(2);s.players=s.players.filter(x=>x.id!==id);s.balance=+(s.balance+fee).toFixed(2);s.market.unshift({name:p.name,type:'cessione',fee,week:s.week});record('Cessione',p.name,`Incassati ${fmt(fee)}`);save();render()}
function pageStart(){return `<div class="tag">Nuova carriera · Serie C simulata</div><h1 class="hero">Non gestisci una squadra.<br>Guidi una società.</h1><p class="muted">Un gioco di scelte, relazioni, risultati e conseguenze. Le società hanno nomi reali; giocatori, rose, valori e avvenimenti sono fittizi. Questa è una simulazione originale, non un archivio ufficiale.</p><div class="section"><h2>Scegli il tuo club</h2><span class="muted small">20 società</span></div><div class="grid">${TEAMS.map((x,i)=>`<div class="card"><div class="tag">Indice ${x[1]}</div><h3 style="margin:9px 0">${x[0]}</h3><p class="muted small">Cassa iniziale ${fmt(x[2])}</p>${b('Diventa presidente',`chooseTeam(${i})`,true)}</div>`).join('')}</div>`}
function eventCard(e){return `<div class="story"><div class="tag">${esc(e.from)} · Settimana ${e.created+1}</div><h2>${esc(e.title)}</h2><p>${esc(e.text)}</p><div class="btnrow">${e.choices.map((x,i)=>b(esc(x[0]),`respond(${e.id},${i})`,i===0)).join('')}</div></div>`}
function desk(){let rank=table().findIndex(x=>x.id===s.team)+1,next=nextMatch();return `<div class="tag">Stagione 2026/27 · Settimana ${Math.min(s.week+1,38)}/38</div><h1 class="hero">${TEAMS[s.team][0]}<span class="muted"> / Presidenza</span></h1><div class="grid"><div class="card"><div class="muted small">Posizione</div><div class="metric">${rank}°</div></div><div class="card"><div class="muted small">Liquidità</div><div class="metric">${fmt(s.balance)}</div></div><div class="card"><div class="muted small">Fiducia consiglio</div><div class="metric">${s.board}%</div><div class="bar"><i style="width:${s.board}%"></i></div></div><div class="card"><div class="muted small">Tifosi</div><div class="metric">${s.fans}%</div><div class="bar"><i style="width:${s.fans}%"></i></div></div></div><div class="section"><h2>La tua scrivania</h2><span class="pill">${s.inbox.length} comunicazioni</span></div>${s.inbox.length?`<div class="list">${s.inbox.map(eventCard).join('')}</div>`:`<div class="card"><h3>Nessuna decisione in sospeso</h3><p class="muted">Puoi proseguire la settimana. Le nuove comunicazioni arriveranno in base agli avvenimenti della carriera.</p></div>`}<div class="section"><h2>Prossimo impegno</h2></div><div class="card">${next?`<div class="tag">Campionato · Giornata ${s.week+1}</div><h2>${TEAMS[next[0]][0]} <span class="muted">vs</span> ${TEAMS[next[1]][0]}</h2><p class="muted small">Forza stimata: ${rating(next[0]).toFixed(1)} — ${rating(next[1]).toFixed(1)} · Tutte le dieci partite vengono simulate.</p>${b('Simula la giornata',`playWeek()`,true)}`:`<h3>Stagione conclusa</h3><p>Hai raggiunto la fine delle 38 giornate. Consulta la classifica e il diario della presidenza.</p>`}</div><div class="section"><h2>Ultime notizie</h2></div><div class="list">${s.news.slice(0,6).map(x=>`<div class="item small"><span class="muted">Sett. ${x.week}</span><span>${esc(x.msg)}</span></div>`).join('')||'<div class="empty">La carriera è appena iniziata.</div>'}</div>`}
function league(){return `<div class="tag">Competizioni / Campionato</div><h1 class="hero">Serie C · Girone C</h1><div class="card" style="overflow-x:auto"><table><thead><tr><th>#</th><th>Squadra</th><th>G</th><th>V</th><th>N</th><th>P</th><th>DR</th><th>Pt</th></tr></thead><tbody>${table().map((x,i)=>`<tr class="${x.id===s.team?'me':''}"><td>${i+1}</td><td>${x.name}</td><td>${x.g}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf-x.ga}</td><td><b>${x.pts}</b></td></tr>`).join('')}</tbody></table></div><div class="section"><h2>Risultati recenti</h2></div><div class="list">${s.results.slice(-20).reverse().map(x=>`<div class="item small"><span>${TEAMS[x.a][0]} — ${TEAMS[x.b][0]}</span><b>${x.ga}–${x.gb}</b></div>`).join('')||'<div class="empty">Campionato non ancora iniziato</div>'}</div>`}
function squad(){return `<div class="tag">Direzione sportiva</div><h1 class="hero">La rosa</h1><p class="muted">${s.players.length} giocatori fittizi · Monte ingaggi annuo ${fmt(s.players.reduce((a,p)=>a+p.wage,0))}</p><div class="list">${[...s.players].sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)).map(p=>`<div class="item"><div><b>${esc(p.name)}</b> <span class="pill">${p.pos}</span><div class="muted small">${p.age} anni · OVR ${p.overall} · ${p.apps} pres. · ${p.goals} gol · Morale ${p.morale}%</div>${p.listed?'<div class="tag">Lista trasferimenti</div>':''}${p.loan?'<div class="tag">Lista prestiti</div>':''}</div><div class="btnrow">${b('Scheda',`playerDetail(${p.id})`)}${p.listed?b('Valuta offerte',`sell(${p.id})`,true):''}</div></div>`).join('')}</div>`}
function market(){return `<div class="tag">Calciomercato</div><h1 class="hero">Trattative</h1><p class="muted">Liquidità ${fmt(s.balance)} · Profili fittizi generati settimanalmente · Trattative soggette a rifiuto</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${candidates().map((p,i)=>`<div class="card"><div class="tag">${p.pos} · OVR ${p.overall}</div><h3 style="margin:9px 0">${p.name}</h3><p class="muted small">${p.age} anni · Richiesta ${fmt(p.value*1.12)}</p>${b('Presenta offerta',`buy(${i})`,true)}</div>`).join('')}</div><div class="section"><h2>Registro operazioni</h2></div><div class="list">${s.market.map(x=>`<div class="item small">${esc(x.name)} · ${x.type} · Sett. ${x.week}<b>${fmt(x.fee)}</b></div>`).join('')||'<div class="empty">Nessuna operazione conclusa</div>'}</div>`}
function office(){return `<div class="tag">Società</div><h1 class="hero">La dirigenza</h1><div class="two"><div class="card"><h3>Riunioni e colloqui</h3><p class="muted small">Incontri con argomenti contestuali, una volta a settimana per reparto.</p><div class="btnrow">${b('Allenatore',`talk('coach')`,true)}${b('Direttore sportivo',`talk('ds')`)}${b('Scouting',`talk('scout')`)}${b('Finanze',`talk('finance')`)}</div></div><div class="card"><h3>Sponsor</h3><p class="muted small">${s.sponsor?`${s.sponsor.name} · ${fmt(s.sponsor.amount)}/anno`:'Nessun accordo firmato'}</p><div class="btnrow">${b('Partner locale',`sponsor(0)`,true)}${b('Partner nazionale',`sponsor(1)`)}</div></div></div><div class="section"><h2>Relazioni e infrastrutture</h2></div><div class="grid">${[['Allenatore',s.coach],['Direttore sportivo',s.ds],['Scouting',s.scout],['Vivaio',s.youth],['Strutture',s.facilities],['Comunicazione',s.press],['Consiglio',s.board],['Tifosi',s.fans]].map(x=>`<div class="card"><div class="muted small">${x[0]}</div><div class="metric">${x[1]}%</div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div><div class="section"><h2>Filosofia di gioco</h2></div><div class="btnrow">${['prudente','equilibrato','offensivo'].map(x=>b(x,`setApproach('${x}')`,s.approach===x)).join('')}</div>`}
function cup(){return `<div class="tag">Competizioni / Coppa</div><h1 class="hero">Coppa nazionale</h1><div class="card"><h3>${!s.cup.alive?'Percorso concluso':s.cup.stage>=4?'Coppa conquistata!':'La tua squadra è ancora in corsa'}</h3><p class="muted">Tabellone semplificato e fittizio a eliminazione diretta, indipendente dal campionato. Premi sportivi per ogni turno superato.</p>${s.cup.alive&&s.cup.stage<4?b('Gioca il prossimo turno',`playCup()`,true):''}</div><div class="section"><h2>Il tuo cammino</h2></div><div class="list">${s.cup.history.map(x=>`<div class="item"><span>Turno ${x.stage} · ${TEAMS[x.a][0]} – ${TEAMS[x.b][0]} ${x.penalties?'(dopo parità)':''}</span><b>${x.ga}–${x.gb}</b></div>`).join('')||'<div class="empty">Nessuna partita disputata</div>'}</div>`}
function journal(){return `<div class="tag">Memoria della presidenza</div><h1 class="hero">Il tuo diario</h1><p class="muted">Le scelte vengono conservate e influenzano i valori della società. Non sono semplici dialoghi decorativi.</p><div class="timeline">${s.decisions.map(x=>`<div><div class="tag">Settimana ${x.week+1}</div><b>${esc(x.title)}</b><div>${esc(x.choice)}</div><div class="muted small">${esc(x.effects)}</div></div>`).join('')||'<div class="empty">Non hai ancora preso decisioni</div>'}</div>`}
function report(){let x=s.report;if(!x)return desk();let mine=x.all.find(z=>z.a===s.team||z.b===s.team);return `<div class="tag">${x.kind==='cup'?'Coppa':'Campionato'} · Risultato finale</div><h1 class="hero">${mine?`${TEAMS[mine.a][0]} ${mine.ga} – ${mine.gb} ${TEAMS[mine.b][0]}`:'Partita conclusa'}</h1><p class="muted">Risultati registrati, situazione sportiva ed economica aggiornata.</p><div class="btnrow">${b('Torna alla presidenza',`go('desk')`,true)}${b('Vedi classifica',`go('league')`)}</div><div class="section"><h2>${x.kind==='cup'?'Risultato di coppa':'Risultati della giornata'}</h2></div><div class="list">${x.all.map(z=>`<div class="item"><span>${TEAMS[z.a][0]} — ${TEAMS[z.b][0]}</span><b>${z.ga}–${z.gb}</b></div>`).join('')}</div>`}
function go(v){tab=v;render()}
function render(){let pages={desk,league,squad,market,office,cup,journal,report};let tabs=[['desk','Presidenza'],['league','Campionato'],['squad','Rosa'],['market','Mercato'],['office','Società'],['cup','Coppa'],['journal','Diario']];$('nav').innerHTML=s?tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}${k==='desk'&&s.inbox.length?' · '+s.inbox.length:''}</button>`).join(''):'';$('app').innerHTML=s?(pages[tab]||desk)():pageStart();save()}
render();
</script></body></html>
