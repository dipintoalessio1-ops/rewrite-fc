<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101719"><title>REWRITE FC — President's Office</title><style>
:root{--bg:#101719;--panel:#182224;--line:#2b393a;--text:#f0f5ef;--muted:#99aaa6;--lime:#c4f27d;--red:#f39a91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:4;background:#101719ed;border-bottom:1px solid var(--line);padding:16px max(18px,calc((100vw - 1080px)/2))}header .brand{font-weight:850;letter-spacing:.14em;font-size:13px}header .sub{font-size:11px;color:var(--muted);letter-spacing:.12em}.wrap{max-width:1080px;margin:auto;padding:22px 18px 95px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--lime);font-weight:750}.hero{font-size:clamp(28px,5vw,44px);letter-spacing:-.05em;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:17px}.card h3{font-size:15px;margin:0 0 10px}.metric{font-size:27px;font-weight:750;letter-spacing:-.04em}.small{font-size:12px}.section{margin:24px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:#263436;color:var(--text);border-radius:10px;padding:10px 13px;font-weight:650}.btn.primary{background:var(--lime);color:#132016;border-color:var(--lime)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.35;cursor:not-allowed}.btnrow{display:flex;flex-wrap:wrap;gap:8px}.nav{display:flex;gap:5px;overflow-x:auto;padding-top:12px}.nav button{background:transparent;border:0;color:var(--muted);padding:8px 13px;border-radius:9px;white-space:nowrap}.nav button.active{background:#2b3935;color:var(--lime)}.list{display:grid;gap:8px}.item{padding:13px;border:1px solid var(--line);border-radius:11px;display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:11px;border:1px solid var(--line);padding:4px 8px;border-radius:99px;color:var(--muted)}.bar{height:6px;border-radius:5px;background:#344141;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--lime)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}select,input{background:#101719;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px}tr.me{color:var(--lime)}.notice{border-left:3px solid var(--lime);padding:10px 14px;background:#202d29;border-radius:0 10px 10px 0;margin:14px 0}.empty{padding:26px;color:var(--muted);text-align:center}.foot{font-size:12px;color:var(--muted);padding:25px 0}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:450px;width:calc(100% - 32px)}dialog::backdrop{background:#000b}dialog h3{margin-top:0}dialog p{color:var(--muted)}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.metric{font-size:23px}.wrap{padding-top:16px}.card{padding:13px}}@media(max-width:350px){.grid{grid-template-columns:1fr 1fr}.metric{font-size:19px}}
</style></head><body><header><div class="top"><div><div class="brand">REWRITE FC <span style="color:var(--lime)">/ REBOOT</span></div><div class="sub">PRESIDENT'S OFFICE · PROTOTIPO AUTONOMO</div></div><button class="btn small" onclick="confirmReset()">Nuova carriera</button></div><nav class="nav" id="nav"></nav></header><main class="wrap" id="app"></main><dialog id="modal"><div id="modalBody"></div><div class="btnrow" style="margin-top:16px;justify-content:flex-end"><button class="btn" onclick="modal.close()">Chiudi</button></div></dialog><script>
'use strict';
const CLUBS=[['Bari',68,24.5],['Catania',73,27],['Salernitana',72,26],['Benevento',75,28],['Crotone',70,24],['Casertana',66,19],['Potenza',65,17],['Monopoli',64,16],['Foggia',64,18],['Cosenza',67,21],['Altamura',59,11],['Cerignola',65,17],['Casarano',61,12],['Cavese',60,13],['Sorrento',58,10],['Latina',61,12],['Giugliano',60,12],['Picerno',59,11],['Siracusa',60,12],['Trapani',66,20]];
// Il campionato e le rose di questo reboot sono una simulazione, non un archivio ufficiale 2026/27.
const FIRST=['Marco','Luca','Andrea','Matteo','Davide','Francesco','Alessandro','Simone','Giuseppe','Nicola','Antonio','Emanuele','Federico','Tommaso','Gabriele','Riccardo','Daniele','Pietro','Vincenzo'];const LAST=['Rossi','Moretti','Romano','Esposito','Greco','Conti','De Luca','Marino','Gallo','Ferrara','Rizzo','Lombardi','Caruso','Mancini','Costa','Leone','Serra','Palmieri','Santoro','Fiore','Longo','Vitale','Martini','Pellegrini'];
const $=id=>document.getElementById(id), money=n=>'€ '+Number(n).toFixed(2)+'M', clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){let t=seed>>>0;return ()=>{t+=0x6D2B79F5;let x=t;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return ((x^(x>>>14))>>>0)/4294967296}}
function createPlayers(team){const r=rng(100+team*997),positions=['POR','POR','POR','DIF','DIF','DIF','DIF','DIF','DIF','DIF','CEN','CEN','CEN','CEN','CEN','CEN','CEN','ATT','ATT','ATT','ATT','ATT'];return positions.map((pos,i)=>{const quality=clamp(Math.round(CLUBS[team][1]-8+r()*17),45,88);return {id:team*100+i,name:FIRST[Math.floor(r()*FIRST.length)]+' '+LAST[Math.floor(r()*LAST.length)],pos,age:18+Math.floor(r()*17),overall:quality,value:+(.1+(quality-45)*.12+r()*.8).toFixed(2),wage:+(.04+(quality-45)*.005).toFixed(2),contract:2027+Math.floor(r()*4),morale:65+Math.floor(r()*26),goals:0,apps:0,listed:false,loan:false}})}
function schedule(n){let teams=Array.from({length:n},(_,i)=>i),rounds=[];for(let k=0;k<n-1;k++){let pairs=[];for(let j=0;j<n/2;j++){let a=teams[j],b=teams[n-1-j];pairs.push(k%2?[b,a]:[a,b])}rounds.push(pairs);teams=[teams[0],teams[n-1],...teams.slice(1,n-1)]}return rounds.concat(rounds.map(p=>p.map(([a,b])=>[b,a])))}
function init(team){return {version:2,team,round:0,year:2026,balance:CLUBS[team][2],fans:64,board:67,coach:65,scout:55,facilities:45,formation:'4-3-3',tactic:'equilibrata',sponsor:0,sponsorName:'',staffMeeting:-1,transfers:[],history:[],cup:{round:0,alive:true,fixtures:[]},fixtures:schedule(20),results:[],players:createPlayers(team),last:null,news:['Benvenuto alla presidenza di '+CLUBS[team][0]+'. La stagione è pronta.'],event:null}}
let state=null,view='dashboard';try{let saved=JSON.parse(localStorage.getItem('rewrite_reboot_v2'));if(saved?.version===2&&Number.isInteger(saved.team))state=saved}catch(e){}
const save=()=>{if(state)localStorage.setItem('rewrite_reboot_v2',JSON.stringify(state))};
function btn(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}
function notify(t){state.news.unshift(t);state.news=state.news.slice(0,35);save()}
function openModal(title,html){$('modalBody').innerHTML=`<h3>${title}</h3>${html}`;$('modal').showModal()}
function showTab(t){view=t;render()}
function confirmReset(){if(confirm('Eliminare la carriera salvata e ricominciare?')){localStorage.removeItem('rewrite_reboot_v2');state=null;view='dashboard';render()}}
function choose(t){state=init(t);save();render()}
function strength(t){let base=CLUBS[t][1];if(t===state.team){let avg=state.players.reduce((a,p)=>a+p.overall,0)/state.players.length;base=base*.45+avg*.55+(state.coach-65)*.1+(state.facilities-45)*.03+(state.tactic==='offensiva'?1:0)}return base}
function simulate(a,b,seed){const r=rng(seed),sa=strength(a),sb=strength(b);let home=1.12+clamp((sa-sb)*.068,-.95,1.05),away=.93+clamp((sb-sa)*.068,-.8,1);function poisson(lambda){let p=1,k=0,L=Math.exp(-lambda);do{k++;p*=r()}while(p>L&&k<12);return k-1}return [poisson(home),poisson(away)]}
function standings(){let table=CLUBS.map((c,id)=>({id,name:c[0],p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));state.results.forEach(x=>{let a=table[x.a],b=table[x.b];a.p++;b.p++;a.gf+=x.ga;a.ga+=x.gb;b.gf+=x.gb;b.ga+=x.ga;if(x.ga>x.gb){a.w++;b.l++;a.pts+=3}else if(x.ga<x.gb){b.w++;a.l++;b.pts+=3}else{a.d++;b.d++;a.pts++;b.pts++}});return table.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function playRound(){if(state.round>=38)return;let idx=state.round,pairs=state.fixtures[idx],out=[];pairs.forEach(([a,b],i)=>{let [ga,gb]=simulate(a,b,idx*1000+i*31+state.team*17+2026);let result={a,b,ga,gb,round:idx+1};state.results.push(result);out.push(result);if(a===state.team||b===state.team){state.last=result;let ours=a===state.team?ga:gb,theirs=a===state.team?gb:ga;state.board=clamp(state.board+(ours>theirs?3:ours===theirs?0:-3),0,100);state.fans=clamp(state.fans+(ours>theirs?2:ours===theirs?0:-2),0,100);state.players.forEach(p=>{if(p.pos==='ATT'&&ours>0&&Math.random()<.24)p.goals++;p.apps++;p.morale=clamp(p.morale+(ours>theirs?2:ours===theirs?0:-2),20,99)})}});state.round++;let wage=state.players.reduce((a,p)=>a+p.wage,0)/38;state.balance=+(state.balance-.18-wage+(state.sponsor?state.sponsor/38:0)).toFixed(2);if(state.round%5===0)state.balance=+(state.balance+.8).toFixed(2);if(state.round%7===0){state.event={kind:'decision',title:'Riunione del consiglio',text:'Il direttore finanziario propone un investimento nel settore giovanile. Come procediamo?',options:[['Investi €0.8M', 'academy'],['Mantieni liquidità','cash']]}};if(state.round===19)state.event={kind:'decision',title:'Mercato invernale',text:'La dirigenza chiede se aprire un budget aggiuntivo per il mercato.',options:[['Stanzia €1.5M','budget'],['Mantieni il piano','cash']]};if(state.round===38)notify('Campionato terminato: '+(standings().findIndex(t=>t.id===state.team)+1)+'° posto.');save();view='match';render()}
function decision(type){if(type==='academy'){state.balance-=.8;state.facilities=clamp(state.facilities+8,0,100);notify('Investimento nelle strutture giovanili approvato.')}else if(type==='budget'){state.balance-=1.5;state.scout=clamp(state.scout+8,0,100);notify('Budget per il mercato invernale stanziato.')}else notify('La società ha scelto una gestione prudente.');state.event=null;save();render()}
function staff(action){if(state.staffMeeting===state.round){openModal('Staff','<p>Hai già convocato lo staff in questa giornata. Potrai farlo dopo la prossima partita.</p>');return}state.staffMeeting=state.round;let responses={coach:['L’allenatore chiede fiducia e continuità nel progetto.','La squadra ha bisogno di maggiore equilibrio tattico.'],scout:['Gli osservatori consigliano di puntare sui giovani.','Lo scouting chiede più risorse per individuare occasioni.'],finance:['Il responsabile finanziario raccomanda prudenza.','La priorità è mantenere sostenibile il monte ingaggi.']};let text=responses[action][state.round%2];if(action==='coach')state.coach=clamp(state.coach+2,0,100);if(action==='scout')state.scout=clamp(state.scout+2,0,100);if(action==='finance')state.board=clamp(state.board+1,0,100);notify('Colloquio con '+({coach:'allenatore',scout:'scouting',finance:'direzione finanziaria'}[action])+': '+text);save();openModal('Colloquio con lo staff',`<p>${text}</p><p class="small">La riunione ha migliorato leggermente il rapporto con il reparto.</p>`);render()}
function setTactic(v){state.tactic=v;notify('Approccio tattico aggiornato: '+v);render()}
function sponsor(kind){if(state.sponsor){openModal('Sponsor','<p>Hai già firmato uno sponsor per questa stagione.</p>');return}let offers=[['Partner locale',1.6,2],['Partner nazionale',2.7,6]];let [name,value,expect]=offers[kind];state.sponsor=value;state.sponsorName=name;state.board=clamp(state.board+1,0,100);notify('Accordo firmato con '+name+' per '+money(value)+' a stagione. Obiettivo: '+expect+'° posto.');render()}
function renew(id){let p=state.players.find(x=>x.id===id);if(!p)return;let cost=+(p.wage*.7).toFixed(2);if(state.balance<cost){openModal('Rinnovo','<p>Liquidità insufficiente per il bonus alla firma.</p>');return}p.contract+=2;p.wage=+(p.wage*1.18).toFixed(2);state.balance=+(state.balance-cost).toFixed(2);notify('Rinnovato '+p.name+' fino al '+p.contract+'. Bonus '+money(cost)+'.');render()}
function toggle(id,type){let p=state.players.find(x=>x.id===id);if(!p)return;p[type]=!p[type];if(p[type])p[type==='listed'?'loan':'listed']=false;notify(p.name+(p[type]?' inserito':' rimosso')+(type==='listed'?' dalla lista trasferimenti.':' dalla lista prestiti.'));render()}
function buyCandidate(i){let p=candidates()[i];if(!p)return;let cost=p.value*1.15;if(state.balance<cost){openModal('Mercato','<p>Disponibilità economica insufficiente.</p>');return}if(state.players.length>=30){openModal('Mercato','<p>Rosa piena: massimo 30 calciatori.</p>');return}state.balance=+(state.balance-cost).toFixed(2);state.players.push({...p,id:10000+state.round*100+i,listed:false,loan:false,apps:0,goals:0});state.transfers.push({name:p.name,fee:cost,type:'acquisto'});notify('Acquistato '+p.name+' per '+money(cost)+'.');render()}
function candidates(){let r=rng(55331+state.round*13);return Array.from({length:6},(_,i)=>{let q=57+Math.floor(r()*22);return {name:FIRST[Math.floor(r()*FIRST.length)]+' '+LAST[Math.floor(r()*LAST.length)],pos:['POR','DIF','CEN','ATT'][i%4],age:19+Math.floor(r()*13),overall:q,value:+(.45+(q-55)*.22).toFixed(2),wage:+(.08+(q-55)*.009).toFixed(2),contract:2029,morale:76}})}
function sell(id){let p=state.players.find(x=>x.id===id);if(!p||!p.listed)return;if(state.players.length<=16){openModal('Cessione','<p>Non puoi scendere sotto 16 calciatori.</p>');return}let price=+(p.value*.85).toFixed(2);state.balance=+(state.balance+price).toFixed(2);state.players=state.players.filter(x=>x.id!==id);state.transfers.push({name:p.name,fee:price,type:'cessione'});notify('Ceduto '+p.name+' per '+money(price)+'.');render()}
function cupPlay(){if(!state.cup.alive||state.cup.round>=4)return;let opponents=[11,5,2,3],o=opponents[state.cup.round];if(o===state.team)o=(o+1)%20;let [a,b]=simulate(state.team,o,9999+state.cup.round*100+state.team);let pen='';if(a===b){let r=rng(8732+state.team*11+state.cup.round);if(r()>.5){a++;pen=' (d.t.s.)'}else{b++;pen=' (d.t.s.)'}}state.cup.fixtures.push({a:state.team,b:o,ga:a,gb:b,label:['Sedicesimi','Ottavi','Quarti','Semifinale'][state.cup.round]+pen});state.cup.round++;state.cup.alive=a>b;if(state.cup.alive){state.balance=+(state.balance+.45).toFixed(2);notify('Coppa: passaggio del turno contro '+CLUBS[o][0]+'!')}else notify('Coppa: eliminazione contro '+CLUBS[o][0]+'.');save();view='cup';render()}
function start(){return `<div class="eyebrow">Nuova carriera</div><h1 class="hero">La società.<br>Le tue decisioni.</h1><p class="muted">Sei il presidente. Scegli una squadra e costruisci un progetto sostenibile, dentro e fuori dal campo.</p><div class="notice">Questo reboot utilizza società come riferimento, ma <b>rose e valori dei calciatori sono generati e dichiaratamente fittizi</b>. Non sono le rose ufficiali 2026/27.</div><div class="section"><h2>Scegli la tua società</h2></div><div class="grid">${CLUBS.map((c,i)=>`<div class="card"><div class="eyebrow">Forza ${c[1]}</div><h3 style="margin:9px 0">${c[0]}</h3><div class="muted small">Budget ${money(c[2])}</div><div style="margin-top:12px">${btn('Diventa presidente',`choose(${i})`,'primary')}</div></div>`).join('')}</div>`}
function dashboard(){let t=standings(),place=t.findIndex(x=>x.id===state.team)+1,next=state.fixtures[state.round]?.find(p=>p.includes(state.team));return `<div class="eyebrow">Stagione ${state.year}/${state.year+1} · Giornata ${Math.min(state.round+1,38)}/38</div><h1 class="hero">${CLUBS[state.team][0]}</h1><p class="muted">Ufficio del presidente · ${place}° in campionato</p><div class="grid"><div class="card"><div class="muted small">Disponibilità</div><div class="metric">${money(state.balance)}</div></div><div class="card"><div class="muted small">Fiducia società</div><div class="metric">${state.board}%</div><div class="bar"><i style="width:${state.board}%"></i></div></div><div class="card"><div class="muted small">Tifoseria</div><div class="metric">${state.fans}%</div><div class="bar"><i style="width:${state.fans}%"></i></div></div><div class="card"><div class="muted small">Forza squadra</div><div class="metric">${strength(state.team).toFixed(0)}</div></div></div>${state.event?`<div class="section"><h2>Decisione del consiglio</h2></div><div class="card"><h3>${state.event.title}</h3><p>${state.event.text}</p><div class="btnrow">${state.event.options.map(o=>btn(o[0],`decision('${o[1]}')`,'primary')).join('')}</div></div>`:''}<div class="split"><div><div class="section"><h2>Prossima partita</h2></div><div class="card">${next?`<div class="eyebrow">Campionato · Giornata ${state.round+1}</div><h2>${CLUBS[next[0]][0]} <span class="muted">vs</span> ${CLUBS[next[1]][0]}</h2><p class="muted small">Simula la giornata completa: tutti i risultati saranno registrati.</p>${btn('Gioca la giornata', 'playRound()','primary')}`:'<h3>Stagione terminata</h3><p>La classifica finale è disponibile nella sezione Campionato.</p>'}</div><div class="section"><h2>Ultime notizie</h2></div><div class="list">${state.news.slice(0,6).map(n=>`<div class="item small">${n}</div>`).join('')}</div></div><div><div class="section"><h2>Il tuo progetto</h2></div><div class="card"><h3>Strategia sportiva</h3><p class="muted small">Approccio attuale: ${state.tactic}</p><div class="btnrow">${['prudente','equilibrata','offensiva'].map(x=>btn(x,`setTactic('${x}')`,state.tactic===x?'primary':'')).join('')}</div><div class="section"><h2>Staff</h2></div><div class="list">${[['Allenatore',state.coach],['Scouting',state.scout],['Strutture',state.facilities]].map(x=>`<div><div class="top small"><span>${x[0]}</span><span>${x[1]}/100</span></div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></div></div></div>`}
function league(){let table=standings(),r=state.round;return `<div class="eyebrow">Campionato</div><h1 class="hero">Classifica</h1><div class="card" style="overflow-x:auto"><table><thead><tr><th>#</th><th>Squadra</th><th>G</th><th>V</th><th>N</th><th>P</th><th>DR</th><th>Pt</th></tr></thead><tbody>${table.map((t,i)=>`<tr class="${t.id===state.team?'me':''}"><td>${i+1}</td><td>${t.name}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`).join('')}</tbody></table></div><div class="section"><h2>Ultimi risultati</h2></div><div class="list">${state.results.slice(-20).reverse().map(x=>`<div class="item small"><span>${CLUBS[x.a][0]} — ${CLUBS[x.b][0]}</span><b>${x.ga}–${x.gb}</b></div>`).join('')||'<div class="empty">Nessuna giornata disputata</div>'}</div>`}
function squad(){let players=[...state.players].sort((a,b)=>['POR','DIF','CEN','ATT'].indexOf(a.pos)-['POR','DIF','CEN','ATT'].indexOf(b.pos));return `<div class="eyebrow">Direzione sportiva</div><h1 class="hero">Rosa</h1><p class="muted">${players.length} calciatori · Stipendi annuali ${money(players.reduce((a,p)=>a+p.wage,0))} · Dati simulati</p><div class="list">${players.map(p=>`<div class="item"><div><b>${p.name}</b> <span class="pill">${p.pos}</span><div class="muted small">${p.age} anni · OVR ${p.overall} · ${money(p.value)} · ${p.apps} pres. · ${p.goals} gol · Contratto ${p.contract}</div><div class="muted small">Stipendio ${money(p.wage)}/anno · Morale ${p.morale}% ${p.listed?'· In vendita':''}${p.loan?'· Prestito':''}</div></div><div class="btnrow">${btn('Rinnova',`renew(${p.id})`)}${btn(p.listed?'Rimuovi vendita':'Lista vendita',`toggle(${p.id},'listed')`)}${btn(p.loan?'Rimuovi prestito':'Lista prestito',`toggle(${p.id},'loan')`)}${p.listed?btn('Vendi',`sell(${p.id})`,'primary'):''}</div></div>`).join('')}</div>`}
function market(){return `<div class="eyebrow">Direzione sportiva</div><h1 class="hero">Mercato</h1><p class="muted">Disponibilità: ${money(state.balance)}. I candidati sono generati per la simulazione.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">${candidates().map((p,i)=>`<div class="card"><div class="eyebrow">${p.pos} · OVR ${p.overall}</div><h3 style="margin:8px 0">${p.name}</h3><p class="muted small">${p.age} anni · Valore ${money(p.value)}<br>Richiesta ${money(p.value*1.15)}</p>${btn('Avvia acquisto',`buyCandidate(${i})`,'primary')}</div>`).join('')}</div><div class="section"><h2>Operazioni concluse</h2></div><div class="list">${state.transfers.map(x=>`<div class="item small">${x.name} · ${x.type}<b>${money(x.fee)}</b></div>`).join('')||'<div class="empty">Nessuna operazione</div>'}</div>`}
function office(){return `<div class="eyebrow">Società</div><h1 class="hero">Uffici</h1><div class="split"><div class="card"><h3>Convoca lo staff</h3><p class="muted small">Una riunione per giornata. Ogni reparto fornisce un parere e migliora il rapporto con la presidenza.</p><div class="btnrow">${btn('Allenatore',"staff('coach')")}${btn('Scouting',"staff('scout')")}${btn('Direzione finanziaria',"staff('finance')")}</div></div><div class="card"><h3>Partnership</h3><p class="muted small">Sponsor attuale: ${state.sponsorName||'Nessuno'}</p><div class="btnrow">${btn('Partner locale · €1.6M','sponsor(0)','primary')}${btn('Partner nazionale · €2.7M','sponsor(1)')}</div></div></div><div class="section"><h2>Indicatori societari</h2></div><div class="grid">${[['Allenatore',state.coach],['Scouting',state.scout],['Strutture',state.facilities],['Fiducia',state.board]].map(x=>`<div class="card"><div class="muted small">${x[0]}</div><div class="metric">${x[1]}%</div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div>`}
function cup(){return `<div class="eyebrow">Coppa nazionale · Simulazione</div><h1 class="hero">La coppa</h1><div class="card"><h3>${state.cup.alive?(state.cup.round===4?'Percorso concluso':'Ancora in corsa'):'Eliminato'}</h3><p class="muted">Torneo dimostrativo a eliminazione diretta. Non riproduce il tabellone ufficiale.</p>${state.cup.alive&&state.cup.round<4?btn('Gioca il prossimo turno','cupPlay()','primary'):''}</div><div class="section"><h2>Il tuo percorso</h2></div><div class="list">${state.cup.fixtures.map(x=>`<div class="item"><span>${x.label}: ${CLUBS[x.a][0]} – ${CLUBS[x.b][0]}</span><b>${x.ga}–${x.gb}</b></div>`).join('')||'<div class="empty">Nessuna partita di coppa disputata</div>'}</div>`}
function match(){let r=state.last;return `<div class="eyebrow">Giornata ${state.round} · Risultato finale</div><h1 class="hero">${r?CLUBS[r.a][0]+' '+r.ga+' — '+r.gb+' '+CLUBS[r.b][0]:'Nessuna partita'}</h1><p class="muted">Tutti i risultati della giornata sono stati registrati in classifica.</p>${btn('Torna alla presidenza',"showTab('dashboard')",'primary')} ${btn('Vedi classifica',"showTab('league')")}<div class="section"><h2>Altri risultati</h2></div><div class="list">${state.results.filter(x=>x.round===state.round).map(x=>`<div class="item"><span>${CLUBS[x.a][0]} — ${CLUBS[x.b][0]}</span><b>${x.ga}–${x.gb}</b></div>`).join('')}</div>`}
function render(){let tabs=[['dashboard','Presidenza'],['league','Campionato'],['squad','Rosa'],['market','Mercato'],['office','Società'],['cup','Coppa']];$('nav').innerHTML=state?tabs.map(([id,label])=>`<button class="${view===id?'active':''}" onclick="showTab('${id}')">${label}</button>`).join(''):'';$('app').innerHTML=state?({dashboard,league,squad,market,office,cup,match}[view]||dashboard)():start();save()};render();
</script></body></html>
